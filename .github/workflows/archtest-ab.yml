# ============================================================================
# ARCHTEST - the architecture A/B experiment
# ============================================================================
# ONE revision, TWO binaries. The only difference between them is one compile
# definition, MGPU_ARCH_COMPAT, which decides whether src/arch_test.cpp
# intercepts NvAPI_GPU_GetArchInfo during MGPU's private DLSS-NR
# feature-creation scope.
#
#   mgpu_arch_control : no interception, no rewrite. Original behaviour.
#   mgpu_arch_compat  : one process-local NVAPI detour, scoped by GPU identity
#                       AND by time, active only around CreateFeature(Reserved18).
#
# Both artifacts are staged exactly like the shipping build - the add-on is
# renamed to nvngx.dll_mgpu_bridge.addon64 in the staging step and nowhere
# else, so the caller-gate property the project depends on is preserved.
#
# The two binaries MUST differ. The compare job fails the run if they are
# identical, because identical binaries would mean the experiment never ran.
#
# RIG INSTRUCTIONS (not a CI step - CI cannot run this):
#   1. Download both artifacts. Each contains the seven-file deploy set plus
#      ARCHTEST_VARIANT.txt and SHA256SUMS.txt, which are diagnostics and are
#      NOT part of the deploy set.
#   2. Deploy the CONTROL set into <game>\bin\x64, launch, let the neural stage
#      arm, then read the [ARCHTEST] lines. Expect mode=CONTROL and a
#      "CreateFeature result=" line.
#   3. Deploy the COMPAT set over it (same seven deploy files, same add-on
#      name), launch again under the same conditions, read [ARCHTEST].
#   4. The comparison is the two "CreateFeature result=" lines. Everything
#      else - resolution, GPU, driver, params, caller name - is identical by
#      construction, because both binaries are this same revision.
# ============================================================================

name: archtest-ab

on:
  workflow_dispatch:
  push:
    branches: [archtest-ab]
    paths:
      - 'src/arch_test.cpp'
      - 'src/arch_test.hpp'
      - '.github/workflows/archtest-ab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same pins as build.yml. Source of truth: VENDOR_LOCK.md.
  RESHADE_SHA: 18deaa52de0c425a78b329e9cb3c497281cd00ec
  NGX_SHA: a291cc7d2cc642a51566f3dfd5376f635cd1b284

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: control
            compat: "OFF"
          - variant: compat
            compat: "ON"

    name: mgpu_arch_${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      # Same containment guard as build.yml, so a variant cannot smuggle in an
      # out-of-scope symbol either.
      - name: Containment check
        shell: bash
        run: |
          PATTERN='GetClockCalibration'
          FOUND=0
          for DIR in src assets; do
            [ -d "$DIR" ] || continue
            if grep -rnE "$PATTERN" "$DIR"; then FOUND=1; fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::Out-of-scope symbol: GetClockCalibration is still guarded (P2.2)"
            exit 1
          fi

      # The experiment must not reach the rig without its own scope guarantees.
      - name: Verify the ARCHTEST contract is present
        shell: bash
        run: |
          test -f src/arch_test.cpp
          test -f src/arch_test.hpp
          grep -q 'ARCHTEST' src/arch_test.cpp
          grep -q 'NvAPI_GPU_GetArchInfo' src/arch_test.cpp
          # the real call must come first
          grep -q 'real_fn(hPhysicalGpu, pInfo)' src/arch_test.cpp || {
            echo "::error::the shim does not call the real NVAPI function first"; exit 1; }
          # no identity, no rewrite
          grep -q 'g_target_known' src/arch_test.cpp || {
            echo "::error::the identity gate is missing"; exit 1; }
          echo "ARCHTEST contract present."

      - name: Fetch ReShade headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/reshade.tar.gz \
            "https://codeload.github.com/crosire/reshade/tar.gz/${RESHADE_SHA}"
          tar -xzf _dl/reshade.tar.gz -C _dl "reshade-${RESHADE_SHA}/include"
          rm -rf ext/reshade
          mv "_dl/reshade-${RESHADE_SHA}/include" ext/reshade
          test -f ext/reshade/reshade.hpp

      - name: Verify pin (RESHADE_API_VERSION 20)
        shell: bash
        run: |
          grep -q 'define RESHADE_API_VERSION 20' ext/reshade/reshade.hpp || {
            echo "::error::Pin drift - fetched tree does not define RESHADE_API_VERSION 20"
            exit 1
          }

      - name: Fetch NVIDIA NGX headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/ngx.tar.gz \
            "https://codeload.github.com/NVIDIA/DLSS/tar.gz/${NGX_SHA}"
          tar -xzf _dl/ngx.tar.gz -C _dl --wildcards "*/include"
          rm -rf ext/ngx
          mv _dl/*/include ext/ngx
          test -f ext/ngx/nvsdk_ngx.h
          test -f ext/ngx/nvsdk_ngx_defs.h
          test -f ext/ngx/nvsdk_ngx_params.h

      - name: Verify NGX pin (NVSDK_NGX_Feature_Reserved18)
        shell: bash
        run: |
          grep -rq 'NVSDK_NGX_Feature_Reserved18' ext/ngx || {
            echo "::error::Pin drift - fetched tree does not declare NVSDK_NGX_Feature_Reserved18"
            exit 1
          }

      # Configure once and read the variant back out of the configure output, so
      # a mistake in the matrix cannot ship two identical binaries.
      - name: Configure (${{ matrix.variant }})
        shell: bash
        run: |
          cmake -B build -A x64 -DMGPU_ARCH_COMPAT=${{ matrix.compat }} 2>&1 | tee _cfg.txt
          grep -qi "ARCHTEST variant = ${{ matrix.variant }}" _cfg.txt || {
            echo "::error::configure did not report the expected ARCHTEST variant"
            echo "expected: ARCHTEST variant = ${{ matrix.variant }}"
            grep -n 'ARCHTEST variant' _cfg.txt || echo "(no ARCHTEST variant line in configure output)"
            exit 1; }

      - name: Build
        run: cmake --build build --config Release

      - name: Verify artifact name
        shell: bash
        run: |
          if find build -name 'mgpu_bridge.addon64.dll' -type f | grep -q .; then
            echo "::error::Built mgpu_bridge.addon64.dll - SUFFIX appended to .dll instead of replacing it"
            exit 1
          fi
          ADDON=$(find build -name 'mgpu_bridge.addon64' -type f | head -n1)
          if [ -z "$ADDON" ]; then
            echo "::error::mgpu_bridge.addon64 not produced"
            find build -maxdepth 3 -type f || true
            exit 1
          fi
          echo "ADDON_PATH=$ADDON" >> "$GITHUB_ENV"
          echo "Output verified: $ADDON"

      - name: Verify shipped presets are empty
        shell: bash
        run: |
          FAIL=0
          if grep -nE '^\s*Techniques\s*=\s*\S' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini enables techniques - a shipped preset must be empty"
            FAIL=1
          fi
          if grep -nE '^\s*TechniqueSorting\s*=\s*\S' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini carries a technique sort order - a shipped preset must be empty"
            FAIL=1
          fi
          if grep -n 'DEBUG' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini carries a debug preprocessor definition"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "assets/gpu1.ini is clean."

      - name: Verify the shipped run is unbounded
        shell: bash
        run: |
          if ! grep -qE '^\s*Frames\s*=\s*0\s*$' assets/mgpu.ini; then
            echo "::error::assets/mgpu.ini does not set Frames=0 - the shipped build must be unbounded"
            exit 1
          fi

      - name: Verify the shipped transport is on
        shell: bash
        run: |
          FAIL=0
          grep -qE '^\s*Depth\s*=\s*1\s*$' assets/mgpu.ini || {
            echo "::error::assets/mgpu.ini does not set Depth=1"; FAIL=1; }
          grep -qE '^\s*MVec\s*=\s*3\s*$' assets/mgpu.ini || {
            echo "::error::assets/mgpu.ini does not set MVec=3"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || exit 1

      # The rename lives here and ONLY here, exactly as build.yml does it.
      - name: Stage deploy set (${{ matrix.variant }})
        shell: bash
        run: |
          mkdir -p _deploy
          cp "$ADDON_PATH" _deploy/nvngx.dll_mgpu_bridge.addon64
          cp assets/gpu1.ini      _deploy/
          cp assets/mgpu.ini      _deploy/
          cp assets/ReShade2.ini  _deploy/
          cp assets/README.txt    _deploy/
          cp LICENSE              _deploy/
          mkdir -p _deploy/reshade-shaders/Shaders
          cp assets/reshade-shaders/Shaders/mgpu_depth_tap.fx _deploy/reshade-shaders/Shaders/

          find _deploy -type f | sort
          test -f _deploy/nvngx.dll_mgpu_bridge.addon64
          test -f _deploy/mgpu.ini
          test -f _deploy/reshade-shaders/Shaders/mgpu_depth_tap.fx
          case "$(ls _deploy)" in
            *nvngx.dll_*) ;;
            *) echo "::error::Deploy set does not carry the nvngx.dll_ caller-gate prefix"; exit 1 ;;
          esac

      # Assert the seven-file deploy set BEFORE any diagnostic file is added,
      # so the diagnostic files can never be mistaken for part of the package.
      - name: Verify the artifact is exactly the seven-file deploy set
        shell: bash
        run: |
          COUNT=$(find _deploy -type f | wc -l)
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::_deploy holds $COUNT files, expected 7"
            find _deploy -type f | sort
            exit 1
          fi
          echo "deploy set is exactly 7 files."

      - name: Record the variant marker and hashes
        shell: bash
        run: |
          {
            echo "variant   = mgpu_arch_${{ matrix.variant }}"
            echo "compat    = ${{ matrix.compat }}"
            echo "commit    = ${GITHUB_SHA}"
            echo "run       = ${GITHUB_RUN_ID}"
            echo "built     = $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ARCHTEST_VARIANT.txt
          cat ARCHTEST_VARIANT.txt

          {
            echo "ARCHTEST artifact hashes - mgpu_arch_${{ matrix.variant }}"
            echo
            echo "Deploy set (7 files, the drop-in package):"
            ( cd _deploy && find . -type f | sort | while read f; do
                printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f"
              done )
            echo
            echo "Add-on alone (the file the compare job keys on):"
            printf '%s  %s\n' \
              "$(sha256sum _deploy/nvngx.dll_mgpu_bridge.addon64 | awk '{print $1}')" \
              "nvngx.dll_mgpu_bridge.addon64"
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Move diagnostics into the artifact directory
        shell: bash
        run: |
          cp ARCHTEST_VARIANT.txt SHA256SUMS.txt _deploy/
          echo "--- final artifact contents ---"
          find _deploy -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: mgpu_arch_${{ matrix.variant }}
          path: |
            _deploy/
            SHA256SUMS.txt
            ARCHTEST_VARIANT.txt
          if-no-files-found: error

  # The experiment is only meaningful if the two binaries are actually
  # different. Compare them and fail the run if they match.
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts

      - name: Compare the two variants
        shell: bash
        run: |
          set -e
          find arts -type f | sort
          HC=$(sha256sum arts/mgpu_arch_control/nvngx.dll_mgpu_bridge.addon64 | awk '{print $1}')
          HP=$(sha256sum arts/mgpu_arch_compat/nvngx.dll_mgpu_bridge.addon64 | awk '{print $1}')
          echo "control = $HC"
          echo "compat  = $HP"
          if [ "$HC" = "$HP" ]; then
            echo "::error::CONTROL and COMPAT binaries are IDENTICAL - the experiment would not test anything"
            exit 1
          fi
          {
            echo "ARCHTEST artifact hashes"
            echo "control nvngx.dll_mgpu_bridge.addon64 = $HC"
            echo "compat  nvngx.dll_mgpu_bridge.addon64 = $HP"
            echo "distinct = yes"
          } > HASHES.txt
          cat HASHES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mgpu_arch_hashes
          path: HASHES.txt
          if-no-files-found: error

# ============================================================================
# NR_RELAY - the game-side half of the out-of-process neural lane
# ============================================================================
# ONE build, ONE artifact, no compare job.
#
# WHAT THIS BUILDS
#   The MGPU add-on with MGPU_NR_RELAY=ON, which compiles src/nr_relay.cpp into
#   mgpu_bridge.addon64. That module is the game-side end of the proven
#   out-of-process architecture: it launches
#   <game>\bin\x64\mgpu\nvngx.dll_mgpu_nr_worker.exe, speaks control protocol v1
#   to it over a named pipe, and publishes the four host-staged frame mappings
#   (COLOR, DEPTH, MOTION_VECTORS, OUTPUT) that carry the pixels.
#
#   The add-on is renamed to nvngx.dll_mgpu_bridge.addon64 in STAGING ONLY, as
#   every other variant workflow does. The nvngx.dll_ prefix is not cosmetic:
#   the DLSSNR snippet inspects the module name of its caller and refuses a
#   caller whose file name does not contain "nvngx.dll", with 0xBAD00002 - the
#   same code the two-device failure returns, which is exactly how that refusal
#   would be misread as the neural blocker. The WORKER keeps the same prefix for
#   the same reason, which is why the relay resolves
#   mgpu\nvngx.dll_mgpu_nr_worker.exe and not mgpu\mgpu_nr_worker.exe.
#
# WHAT THIS BUILD CHANGES, AND WHAT IT DOES NOT
#   It changes ONE thing: it compiles the relay module and defines
#   MGPU_NR_RELAY, which is the module's own #ifdef. Nothing calls the relay -
#   the frame-pipeline call site is a separate, later piece of work written
#   against src/nr_relay.hpp - so a run of this artifact with no worker deployed
#   behaves as the add-on behaves without it.
#
# THE FROZEN BASELINE - asserted at configure time
#   MGPU_ARCH_COMPAT=ON          architecture spoofing untouched
#   MGPU_CONTRACT_EXPANDED=ON    CreateFeature parameter contract untouched
#   MGPU_NVAPI_EXPLICIT_INIT=OFF no explicit NvAPI_Initialize
#   MGPU_CUDA_DIAG=ON            the observer for the two CUDA-interop calls
#   MGPU_RESHADE_NATIVE=ON       the unwrapped-device P1.0c lane
#   MGPU_APPID_NS=OFF            the Reserved18 ApplicationId stays 0ULL
#   MGPU_NR_RELAY=ON             THE VARIABLE
#
#   This is appid-ns.yml's baseline exactly, with MGPU_APPID_NS held at its
#   default OFF: the relay creates no NGX session of its own, so it must not
#   move the ApplicationId of the sessions that do exist. Every flag is asserted
#   after configure, so a run whose configure output does not say so fails here
#   rather than producing a plausible artifact.
#
# WHAT THE GATES BELOW ARE FOR
#   1. THE HONEST DESIGN, in the SOURCE. The relay's whole value is that it
#      quotes the worker's Reserved18 result instead of interpreting it. So the
#      source gate checks the ONE string literal that can produce the word
#      Success, that it is guarded by a comparison against the worker's 1, that
#      the fixed log line is present verbatim, and that no other
#      snprintf/printf argument list in the module can produce that word. A
#      comment is not evidence and is not forbidden: only string literals are
#      inspected.
#   2. THE WIRE LAYOUT IS NOT DRIFTING. The relay does NOT include
#      tools/nr_worker/nr_proto.h - the add-on must not gain a build-time path
#      into the worker's tree - so it reproduces the v1 layout with the same
#      size and field-offset static_asserts. This job diffs the two sets of
#      numbers, so a change to the protocol cannot pass unnoticed here.
#   3. THE HONEST DESIGN, in the BINARY that ships. The strings the relay must
#      contain are grepped out of mgpu_bridge.addon64 itself, not out of the
#      source tree.
#
# WHAT CI DOES NOT PROVE, AND THIS WORKFLOW DOES NOT CLAIM
#   Not one pixel. There is no NVIDIA adapter on a GitHub runner, so the
#   Reserved18 session, the four mappings carrying a real frame and the neural
#   evaluation cannot happen here. CI proves that the module COMPILES into the
#   add-on, that the gates above hold, and that the module obeys its honesty
#   rules against a real --protocol-only worker process (the nr-worker workflow
#   runs that test). The rig result needs the rig, and the rig cannot run newly
#   built unsigned binaries while Smart App Control is on - a known, separate
#   blocker that this workflow does not attempt to work around.
# ============================================================================

name: nr-relay-ab

on:
  workflow_dispatch:
  push:
    # Same dedicated branch as the other experiments. Not main.
    branches: [archtest-ab]
    paths:
      - 'src/nr_relay.cpp'
      - 'src/nr_relay.hpp'
      - 'CMakeLists.txt'
      - 'tools/nr_worker/nr_relay_selftest.cpp'
      - '.github/workflows/nr-relay-ab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RESHADE_SHA: 18deaa52de0c425a78b329e9cb3c497281cd00ec
  NGX_SHA: a291cc7d2cc642a51566f3dfd5376f635cd1b284
  MINHOOK_SHA: c3fcafdc10146beb5919319d0683e44e3c30d537

jobs:
  build:
    runs-on: windows-latest
    name: mgpu_nr_relay
    steps:
      - uses: actions/checkout@v4
        with:
          # The structural gates read history; a depth-1 clone does not contain it.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 1. THE RELAY IS THE IPC HALF, AND ONLY THE IPC HALF. The RTX 4070
      #    device, the NGX core, the architecture patch, the DLSSNR runtime and
      #    the Reserved18 session live in the worker process. If src/nr_relay.cpp
      #    ever reaches for any of them, this experiment has silently become a
      #    second copy of the thing the architecture exists to keep out of the
      #    game, and the artifact would be worthless. Comments are stripped
      #    first, because the file explains at length what it does NOT do.
      # ---------------------------------------------------------------------
      - name: The relay owns the IPC channel and nothing else
        shell: bash
        run: |
          test -f src/nr_relay.cpp || { echo "::error::missing src/nr_relay.cpp"; exit 1; }
          test -f src/nr_relay.hpp || { echo "::error::missing src/nr_relay.hpp"; exit 1; }

          hits() {   # hits <pattern> <file...>  - on code lines only
            local pat="$1"; shift
            local f
            for f in "$@"; do
              [ -f "$f" ] || continue
              sed 's|//.*$||' "$f" | grep -nE "$pat" | sed "s|^|$f:|" || true
            done
          }

          # Nothing that creates or releases a neural session, and nothing from
          # the worker's own translation units.
          H=$(hits 'nvsdk_ngx|NVSDK_NGX|NvAPI_|nvapi64|CreateFeature|AllocateParameters|Init_Ext|nr_lane|nr_transport|mgpu_nr_worker' \
                   src/nr_relay.cpp src/nr_relay.hpp)
          # Two quoted strings are legitimate and are checked to still be there:
          # the deployed worker's file name (a caller-gate contract, not a
          # dependency) and the src=worker attribution in the fixed log line.
          H=$(printf '%s\n' "$H" | grep -vF 'nvngx.dll_mgpu_nr_worker.exe' \
                | grep -vF 'src=worker' || true)
          [ -z "$H" ] || {
            echo "$H"
            echo "::error::the relay references the neural session or the worker's lane"
            exit 1
          }
          grep -qF 'nvngx.dll_mgpu_nr_worker.exe' src/nr_relay.cpp || {
            echo "::error::the relay no longer names the deployed worker with its nvngx.dll_ prefix"
            exit 1; }

          # No D3D12 either: the module takes host pointers and never a device.
          H=$(hits 'ID3D12|d3d12|D3D12CreateDevice' src/nr_relay.cpp src/nr_relay.hpp)
          [ -z "$H" ] || {
            echo "$H"
            echo "::error::the relay touches D3D12. It must hand frames over as host pointers."
            exit 1
          }

          # It must not include the worker's headers, and it must not climb out
          # of src/ for anything.
          H=$(grep -nE '#include[[:space:]]*[<"](nr_proto|nr_pipe|nr_slots|nr_lane|nr_worker)' \
                src/nr_relay.cpp src/nr_relay.hpp || true)
          [ -z "$H" ] || {
            echo "$H"
            echo "::error::the relay includes the worker's headers. It must be self-contained."
            exit 1
          }
          H=$(hits '#include[[:space:]]*[<"][.][.]/' src/nr_relay.cpp src/nr_relay.hpp)
          [ -z "$H" ] || { echo "$H"; echo "::error::the relay includes outside src/"; exit 1; }

          # The include set, so a new dependency cannot arrive unnoticed: windows.h
          # and the C++ runtime, which is what "no new link library" means.
          N=$(grep -cE '^#include' src/nr_relay.cpp || true)
          [ "$N" -le 12 ] || {
            echo "::error::the relay has $N includes; it is meant to be windows.h and the CRT"
            exit 1; }
          grep -qE '^#include <windows.h>' src/nr_relay.cpp || {
            echo "::error::the relay does not include windows.h directly"; exit 1; }

          echo "relay verified: IPC and host memory only; no device, no NGX, no NVAPI, no D3D12."

      # ---------------------------------------------------------------------
      # 2. THE HONESTY RULE, IN THE SOURCE.
      #
      #    A COMMENT IS NOT EVIDENCE, AND IS NOT FORBIDDEN. What is inspected is
      #    the STRING LITERALS, because those are what a log line can contain.
      #    The claim: exactly one literal in the whole module is the word
      #    Success, it lives in reserved18_name(), and it is reachable only
      #    through a comparison against the worker's own 1.
      # ---------------------------------------------------------------------
      - name: The module can only claim Success for the worker's own 1
        shell: bash
        run: |
          F=src/nr_relay.cpp

          # A COMMENT IS NOT EVIDENCE, and is not a violation either. The word
          # appears in this file's prose (it documents the rule it obeys), so the
          # inspection below is over CODE: block comments and line comments are
          # removed first, and only then are string literals counted. A gate that
          # forbade the word outright would fail on the first honest comment
          # written about it - and a gate that strict gets deleted.
          sed -e 's|/\*[^*]*\*/||g' -e 's|//.*$||' "$F" > /tmp/nr_relay_nocomments.cpp

          # (a) Exactly one Success literal in the module's CODE.
          N=$(grep -c '"Success"' /tmp/nr_relay_nocomments.cpp || true)
          [ "$N" -eq 1 ] || {
            echo "::error::the module contains $N code-level \"Success\" string literals, expected 1"
            grep -n '"Success"' /tmp/nr_relay_nocomments.cpp || true
            exit 1; }
          # And it is the return of reserved18_name for the value 1 - the only
          # comparison against the worker's own 1 in the file.
          grep -qF 'if (value == 1) return "Success";' "$F" || {
            echo "::error::the one Success literal is not guarded by the worker's 1"
            grep -n '"Success"' "$F"
            exit 1; }
          # The predicate the selftest asserts is the same comparison.
          grep -qE 'return value == 1;' "$F" || {
            echo "::error::reserved18_is_success is not a comparison against 1"; exit 1; }

          # (b) The fixed log line, verbatim, with both format specifiers.
          grep -qF '"[MGPU][RELAY] CreateFeature(Reserved18) result=0x%08X (%s) src=worker"' "$F" || {
            echo "::error::the fixed Reserved18 log line is not the agreed one"; exit 1; }
          grep -qF '[MGPU][RELAY]' "$F" || {
            echo "::error::the log prefix is not [MGPU][RELAY]"; exit 1; }

          # (c) NO OTHER STRING LITERAL CAN PRODUCE THE WORD, and that is checked
          #     per argument list rather than by grep: every snprintf/printf-style
          #     call in the module is scanned and the literals in its argument
          #     list must not contain the word. Comments are already gone from the
          #     file this reads, so the prose about the rule cannot fail it.
          python - "$F" <<'PY'
          import re, sys
          src = open(sys.argv[1], encoding="utf-8").read()
          # String literals only: strip // comments and /* */ blocks first, so a
          # comment that merely mentions the word cannot fail the gate and cannot
          # pass it either.
          src = re.sub(r"/\*.*?\*/", "", src, flags=re.S)
          src = re.sub(r"//[^\n]*", "", src)
          bad = []
          for m in re.finditer(r"\b(snprintf|printf|fprintf|sprintf|vsnprintf|_snprintf)\s*\(",
                               src):
            # A generous window: the format literal is one of the first few
            # arguments, and every literal up to the call's closing parenthesis
            # is inspected, so a Success literal smuggled into an argument is
            # caught too.
            window = src[m.end():m.end() + 800]
            depth, i = 1, 0
            while i < len(window) and depth:
                if window[i] == "(":
                    depth += 1
                elif window[i] == ")":
                    depth -= 1
                i += 1
            call = window[:i]
            for lit in re.findall(r'"((?:[^"\\]|\\.)*)"', call):
                if "Success" in lit:
                    line = src[:m.start()].count("\n") + 1
                    bad.append((line, lit))
          if bad:
            for line, lit in bad:
                print(f"::error file=src/nr_relay.cpp,line={line}::a printf-style argument list "
                      f"can produce the word Success: {lit}")
            sys.exit(1)
          print("no other printf-style argument list in the module can produce the word Success")
          PY

          # (d) The evidence string the module records is the same line it logs.
          grep -q 'reserved18_evidence' src/nr_relay.hpp || {
            echo "::error::the module does not expose the Reserved18 evidence string"; exit 1; }

          echo "honesty verified: one Success literal, guarded by the worker's 1, in the fixed line."

      # ---------------------------------------------------------------------
      # 3. THE WIRE LAYOUT IS A REPRODUCTION, NOT A SECOND OPINION.
      #
      #    The relay does not include nr_proto.h (see the file's header), so the
      #    two sets of numbers are diffed here. Every constant and every struct
      #    size the add-on declares must equal the worker's.
      # ---------------------------------------------------------------------
      - name: The relay's v1 layout equals the worker's
        shell: bash
        run: |
          W=tools/nr_worker/nr_proto.h
          # InputSlot lives beside the frame pipeline, not in nr_proto.h, and the
          # gate reads it from wherever it is declared rather than assuming.
          WS=tools/nr_worker/nr_slots.h
          R=src/nr_relay.cpp
          test -f "$W" || { echo "::error::missing $W"; exit 1; }
          test -f "$WS" || { echo "::error::missing $WS"; exit 1; }

          need() {   # need <constant> <expected value pattern>
            grep -qE "$2" "$W" || { echo "::error::$W no longer declares $1 as $2"; exit 1; }
            grep -qE "$2" "$R" || { echo "::error::$R does not reproduce $1 as $2"; exit 1; }
          }
          need PROTO_MAGIC   'PROTO_MAGIC = 0x5550474Du;'
          need PROTO_VERSION 'PROTO_VERSION = 1u;'
          need PROTO_NAME_MAX 'PROTO_NAME_MAX = 64;'
          need PROTO_TEXT_MAX 'PROTO_TEXT_MAX = 192;'
          need FRAME_SLOT_COUNT 'FRAME_SLOT_COUNT = 3;'
          need HELLO 'HELLO = 1'
          need WORKER_READY 'WORKER_READY = 2'
          need CONFIG 'CONFIG = 3'
          need FRAME_SUBMIT 'FRAME_SUBMIT = 4'
          need FRAME_COMPLETE 'FRAME_COMPLETE = 5'
          need SHUTDOWN 'SHUTDOWN = 6'
          need ERROR_MESSAGE 'ERROR_MESSAGE = 7'

          # The two enumerations are spelled differently on the two sides (the
          # worker declares them one member per line; the relay packs them), so
          # they are compared as NUMBERS, extracted from the real declarations
          # rather than matched as text. This is the check that matters: it is the
          # VALUE that goes on the wire.
          if ! python - "$W" "$WS" "$R" <<'PY'
          import re, sys
          w = open(sys.argv[1], encoding="utf-8").read()
          s = open(sys.argv[2], encoding="utf-8").read()
          r = open(sys.argv[3], encoding="utf-8").read()

          def enum_values(text, enum_name):
              # The enum body: from "enum class <name>" (with or without an
              # explicit underlying type) to its closing brace.
              m = re.search(r"enum\s+class\s+" + enum_name + r"\s*(?::[^{]*?)?\s*\{(.*?)\}",
                            text, flags=re.S)
              if not m:
                  print(f"::error::no enum class {enum_name} here")
                  sys.exit(1)
              out = {}
              nxt = 0
              body = m.group(1)
              # Drop // comments inside the body before splitting on commas.
              body = re.sub(r"//[^\n]*", "", body)
              for part in body.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  name, _, val = part.partition("=")
                  name = name.strip()
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name):
                      continue
                  if val.strip():
                      v = int(val.strip().rstrip("uU"), 0)
                  else:
                      v = nxt
                  out[name] = v
                  nxt = v + 1
              if not out:
                  print(f"::error::enum class {enum_name} parsed to nothing")
                  sys.exit(1)
              return out

          wk = enum_values(w, "Kind")
          rk = enum_values(r, "Kind")
          ws = enum_values(s, "InputSlot")
          rs = enum_values(r, "InputSlot")
          bad = 0
          for name in ("HELLO", "WORKER_READY", "CONFIG", "FRAME_SUBMIT", "FRAME_COMPLETE",
                       "SHUTDOWN", "ERROR_MESSAGE"):
              if wk.get(name) != rk.get(name):
                  print(f"::error::kind {name}: worker={wk.get(name)} relay={rk.get(name)}")
                  bad = 1
          for name in ("COLOR", "DEPTH", "MOTION_VECTORS", "OUTPUT", "COUNT"):
              if ws.get(name) != rs.get(name):
                  print(f"::error::input slot {name}: worker={ws.get(name)} relay={rs.get(name)}")
                  bad = 1
          if bad:
              sys.exit(1)
          print(f"kinds worker={sorted(wk.items())}")
          print(f"kinds relay ={sorted(rk.items())}")
          print(f"slots worker={sorted(ws.items())}")
          print(f"slots relay ={sorted(rs.items())}")
          print("both enumerations agree, member for member, by VALUE")
          PY
          then
            echo "::error::the relay's enumerations do not match the worker's"
            exit 1
          fi

          # The struct sizes and the field offsets, which is what the static_asserts
          # in BOTH files pin. The expressions are compared as text, so a change to
          # one side alone fails here even if it still compiles there.
          for A in \
            'sizeof(Header) == 16' \
            'offsetof(Hello, client_name) == 32' \
            'sizeof(Hello) == 32 + PROTO_NAME_MAX' \
            'offsetof(WorkerReady, worker_name) == 56' \
            'sizeof(WorkerReady) == 56 + PROTO_NAME_MAX' \
            'offsetof(Config, shared_name) == 52' \
            'sizeof(Config) == 52 + PROTO_NAME_MAX' \
            'sizeof(FrameSubmit) == 56' \
            'sizeof(FrameComplete) == 40' \
            'sizeof(Shutdown) == 20' \
            'offsetof(Error, text) == 24' \
            'sizeof(Error) == 24 + PROTO_TEXT_MAX' ; do
            grep -qF "static_assert($A" "$W" || {
              echo "::error::$W does not pin [$A]"; exit 1; }
            grep -qF "static_assert($A" "$R" || {
              echo "::error::$R does not pin [$A] - the reproduction has drifted"; exit 1; }
          done

          # The MAPPING SIZE ARITHMETIC, which the worker validates on
          # OpenFileMappingW: row_bytes = width * bpp, row_pitch =
          # align_up(row_bytes, 256), slice_pitch = row_pitch * height, and the
          # mapping is sized for ALL FRAME_SLOT_COUNT slots. A slip here is
          # refused by the worker on the rig, so it is pinned here.
          grep -qE 's\.row_bytes = w \* s\.bpp;' "$R" || {
            echo "::error::the relay's row_bytes is not width * bytes-per-pixel"; exit 1; }
          grep -qE 's\.row_pitch = \(unsigned\)\(\(\(\(unsigned long long\)s\.row_bytes\) \+ 255ull\) & ~255ull\);' "$R" || {
            echo "::error::the relay's row_pitch is not align_up(row_bytes, 256)"; exit 1; }
          grep -qE 's\.slice_pitch = s\.row_pitch \* h;' "$R" || {
            echo "::error::the relay's slice_pitch is not row_pitch * height"; exit 1; }
          grep -qE 's\.bytes = \(unsigned long long\)s\.slice_pitch \* \(unsigned long long\)wire::FRAME_SLOT_COUNT;' "$R" || {
            echo "::error::the relay's mapping is not sized for all FRAME_SLOT_COUNT slots"; exit 1; }
          grep -q 'c.frame_slots = wire::FRAME_SLOT_COUNT;' "$R" || {
            echo "::error::CONFIG does not carry frame_slots"; exit 1; }

          echo "wire layout verified: every constant, size, offset and pitch rule matches."

      # ---------------------------------------------------------------------
      # 3b. THE GEOMETRY CONTRACT IS PER SLOT, AND submit() REFUSES A MISMATCH.
      #
      #     This is the gate for the defect that would have made every other
      #     honesty rule meaningless. The lane's real frame is colour 3840x2160
      #     fmt=28 with motion vectors 1920x1080 fmt=10 in the SAME frame. A
      #     relay with one geometry for all four slots would tell the worker to
      #     read the top `height` rows of a taller buffer and the result would
      #     still come back hr == 0 with a changed OUTPUT - a PASS on a truncated
      #     frame. So: the contract is per slot, CONFIG carries it per slot, and
      #     submit() compares the frame against the slot it is handed to.
      # ---------------------------------------------------------------------
      - name: The geometry contract is per slot and a mismatch is refused
        shell: bash
        run: |
          R=src/nr_relay.cpp
          H=src/nr_relay.hpp

          # (a) The contract is per slot in the API, not one geometry in Config.
          grep -q 'struct SlotConfig' "$H" || {
            echo "::error::there is no per-slot descriptor in the relay's API"; exit 1; }
          grep -q 'SlotSet slots' "$H" || {
            echo "::error::Config does not carry a set of per-slot descriptors"; exit 1; }
          # THE Config BODY ITSELF, extracted by brace depth from its opening
          # brace, because a whole-file grep cannot tell "Config has no width"
          # from "no struct here has a width" - and SlotConfig and the relay's
          # own slot record both legitimately have one.
          awk '
            /struct Config$/ { in_cfg = 1 }
            in_cfg {
              line = $0
              print line
              o = gsub(/\{/, "{", line)
              c = gsub(/\}/, "}", line)
              if (o > 0) started = 1
              depth += o - c
              if (started && depth <= 0) exit
            }
          ' "$H" > /tmp/nr_relay_config_body.txt
          test -s /tmp/nr_relay_config_body.txt || {
            echo "::error::could not extract the Config body from $H"; exit 1; }
          H_OLD=$(grep -nE '^[[:space:]]*unsigned (width|height)[[:space:]]*=' \
                    /tmp/nr_relay_config_body.txt || true)
          [ -z "$H_OLD" ] || {
            echo "$H_OLD"
            echo "::error::Config still carries ONE geometry for all four slots"; exit 1; }
          grep -q 'SlotSet slots' /tmp/nr_relay_config_body.txt || {
            echo "::error::the SlotSet is not inside Config"; exit 1; }
          # All four descriptors are initialised, so a caller cannot forget one.
          N=$(grep -cE '^[[:space:]]*\{ [0-9]+u, [0-9]+u, [0-9]+u \},' \
                /tmp/nr_relay_config_body.txt || true)
          [ "$N" -eq 4 ] || {
            echo "::error::Config initialises $N of the four slots, expected 4"; exit 1; }
          echo "--- the four default slot descriptors ---"
          grep -E '^[[:space:]]*\{ [0-9]+u, [0-9]+u, [0-9]+u \},' /tmp/nr_relay_config_body.txt
          # Four named descriptors, addressed by a lookup that cannot go wrong.
          grep -q 'const SlotConfig \*slot_config(const Config &cfg, unsigned slot_index);' "$H" || {
            echo "::error::there is no slot_config() accessor"; exit 1; }
          # And the module never takes Config BY VALUE, so it cannot be copying a
          # session-wide geometry around: every use is a reference or a pointer.
          BYVAL=$(grep -nE 'Config[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[,)]' "$R" || true)
          [ -z "$BYVAL" ] || {
            echo "$BYVAL"
            echo "::error::the relay takes Config by value somewhere"; exit 1; }

          # (b) Each slot is published and configured from ITS OWN numbers.
          grep -q 'c.width = s.width;' "$R" || {
            echo "::error::CONFIG does not carry the slot's own width"; exit 1; }
          grep -q 'c.height = s.height;' "$R" || {
            echo "::error::CONFIG does not carry the slot's own height"; exit 1; }
          grep -q 'c.dxgi_format = s.dxgi_format;' "$R" || {
            echo "::error::CONFIG does not carry the slot's own format"; exit 1; }
          grep -q 'slot_publish(s, order\[i\], g.pipe, sc->width, sc->height, sc->dxgi_format,' "$R" || {
            echo "::error::slot_publish is not called with the per-slot geometry"; exit 1; }
          # And the published numbers are KEPT, because submit() checks against
          # them rather than against a session-wide value. The relay's own Slot
          # record carries them, and SlotInfo reports them.
          grep -qE 'unsigned[[:space:]]+width[[:space:]]*=[[:space:]]*0u;' "$H" || {
            echo "::error::the per-slot descriptor does not carry a width"; exit 1; }
          grep -q 's.width = w;' "$R" || {
            echo "::error::the Slot record does not keep the published width"; exit 1; }
          grep -q 's.height = h;' "$R" || {
            echo "::error::the Slot record does not keep the published height"; exit 1; }
          grep -q 'out.width = s.width;' "$R" || {
            echo "::error::SlotInfo does not report the slot's own width"; exit 1; }

          # (c) submit() checks the ROW COUNT, the ROW LENGTH and the STRIDE,
          #     each per slot, and each as a returned refusal that names the slot.
          for S in 'if (frame.height != s.height)' 'if (in.row_bytes != s.row_bytes)' \
                   'if (in.stride < in.row_bytes)'; do
            grep -qF "$S" "$R" || {
              echo "::error::submit() does not perform [$S]"; exit 1; }
          done
          # A row count that does not fit is not clamped: the loop that copies
          # rows runs to the SLOT's height and nothing adjusts it.
          grep -q 'for (unsigned y = 0u; y < s.height; ++y)' "$R" || {
            echo "::error::the row copy does not count rows from the slot's own height"; exit 1; }
          # The refusals quote both geometries and name the slot.
          grep -q 'the frame has %u rows and the %s slot was published with %u' "$R" || {
            echo "::error::the row-count refusal does not quote both geometries"; exit 1; }
          grep -q '%u bytes per pixel' "$R" || {
            echo "::error::the row-length refusal does not explain bytes per pixel"; exit 1; }
          grep -q 'the %s stride is %u bytes and a row is %u' "$R" || {
            echo "::error::the stride refusal does not quote both numbers"; exit 1; }

          # (d) And the test that exercises it: the mismatch must be REFUSED and
          #     the same frame at the published numbers must get past.
          T=tools/nr_worker/nr_relay_selftest.cpp
          test -f "$T" || { echo "::error::missing $T"; exit 1; }
          grep -q 'submit() REFUSES a frame whose row count is not the slot' "$T" || {
            echo "::error::the selftest does not assert the row-count refusal"; exit 1; }
          grep -q 'submit() REFUSES a row length that is not the format' "$T" || {
            echo "::error::the selftest does not assert the row-length refusal"; exit 1; }
          grep -q 'submit() REFUSES a stride shorter than a row' "$T" || {
            echo "::error::the selftest does not assert the stride refusal"; exit 1; }
          grep -q 'refused by the SESSION guard, not the geometry' "$T" || {
            echo "::error::the selftest does not assert that the correct geometry gets past"
            exit 1; }
          # The test must publish DIFFERENT geometries per slot, or those
          # refusals would be untested assertions.
          grep -q 'cfg.slots.motion_vectors = { mv_width, mv_height, 10u }' "$T" || {
            echo "::error::the selftest publishes the same geometry for every slot"; exit 1; }

          # (e) AND THE CALLER OWNS THE REDUCTION TO R. The relay never resamples,
          #     and the header has to say so, because the implication runs the
          #     other way otherwise.
          grep -q 'THE RELAY DOES NOT RESAMPLE' "$H" || {
            echo "::error::the header does not state that the relay never resamples"; exit 1; }
          grep -q 'NEURAL SIZE R' "$H" || {
            echo "::error::the header does not name the neural size R"; exit 1; }
          # The worker's own limit is stated on this side too, because it bounds
          # what the relay can be asked to do at all: the worker refuses a frame
          # whose extent is not the one its Reserved18 feature was created at.
          # This is documentation at the point of refusal, not a second copy of
          # the worker's constants - the value named here must be updated when
          # that pin moves, and the gate keeps the sentence alive to force it.
          grep -q 'the one its Reserved18 feature was created at' "$R" || {
            echo "::error::the relay's refusals no longer state the worker's own geometry limit"
            exit 1; }
          grep -q "frame path refuses a frame whose extent is" "$H" || {
            echo "::error::the header does not document the worker's geometry limit"; exit 1; }

          echo "geometry verified: per-slot contract, per-slot CONFIG, three refusals, tested."

      # ---------------------------------------------------------------------
      # 4. Structural substitutes for a compiler. The relay is the one file
      #    here that carries conditional compilation, so its nesting and its
      #    braces are checked rather than assumed.
      # ---------------------------------------------------------------------
      - name: Structural checks
        shell: bash
        run: |
          for F in src/nr_relay.cpp src/nr_relay.hpp tools/nr_worker/nr_relay_selftest.cpp; do
            test -f "$F" || { echo "::error::missing $F"; exit 1; }

            awk '
              /^[ \t]*#[ \t]*(ifdef|ifndef|if)\b/ { depth++ }
              /^[ \t]*#[ \t]*endif\b/            { depth--; if (depth < 0) neg = 1 }
              END {
                if (depth != 0 || neg) {
                  printf "::error::%s preprocessor nesting does not close (depth=%d, underflow=%d)\n", FILENAME, depth, neg
                  exit 1
                }
              }
            ' "$F" || exit 1

            # Braces inside string literals and // comments are skipped by the
            # same character walk that counts them, escaped quotes included, so
            # the count is a fact about the code and not about the prose in it.
            awk '
              {
                line = $0
                instr = 0
                for (i = 1; i <= length(line); i++) {
                  c = substr(line, i, 1)
                  if (instr) {
                    if (c == "\\") { i++; continue }
                    if (c == "\"") instr = 0
                    continue
                  }
                  if (c == "\"") { instr = 1; continue }
                  if (c == "/" && substr(line, i + 1, 1) == "/") break
                  if (c == "{") depth++
                  else if (c == "}") { depth--; if (depth < 0) neg = 1 }
                }
              }
              END {
                if (depth != 0 || neg) {
                  printf "::error::%s brace imbalance (depth=%d, underflow=%d)\n", FILENAME, depth, neg
                  exit 1
                }
              }
            ' "$F" || exit 1
            echo "$F: nesting closes, braces balance"
          done

          # The module is inert without the definition: the guard must be there,
          # and it must be the LAST thing in the file so nothing compiles outside
          # it. The option in CMakeLists.txt is what sets it.
          grep -qE '^#ifdef MGPU_NR_RELAY$' src/nr_relay.cpp || {
            echo "::error::the #ifdef MGPU_NR_RELAY guard is missing"; exit 1; }
          grep -qE '^#endif   // MGPU_NR_RELAY$' src/nr_relay.cpp || {
            echo "::error::the guard is not closed with a named #endif"; exit 1; }
          grep -qE '^option\(MGPU_NR_RELAY' CMakeLists.txt || {
            echo "::error::MGPU_NR_RELAY is not an option in the add-on's CMakeLists.txt"; exit 1; }
          grep -q 'target_compile_definitions(mgpu_bridge PRIVATE MGPU_NR_RELAY=1)' CMakeLists.txt || {
            echo "::error::MGPU_NR_RELAY=ON does not define anything for the add-on"; exit 1; }
          grep -qE '^[[:space:]]*src/nr_relay\.cpp$' CMakeLists.txt || {
            echo "::error::src/nr_relay.cpp is not in the add-on's source list"; exit 1; }
          echo "structural checks passed: guard present, option present, source wired."

      - name: Fetch ReShade headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/reshade.tar.gz \
            "https://codeload.github.com/crosire/reshade/tar.gz/${RESHADE_SHA}"
          tar -xzf _dl/reshade.tar.gz -C _dl "reshade-${RESHADE_SHA}/include"
          rm -rf ext/reshade
          mv "_dl/reshade-${RESHADE_SHA}/include" ext/reshade
          test -f ext/reshade/reshade.hpp
          grep -q 'define RESHADE_API_VERSION 20' ext/reshade/reshade.hpp

      - name: Fetch NVIDIA NGX headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/ngx.tar.gz \
            "https://codeload.github.com/NVIDIA/DLSS/tar.gz/${NGX_SHA}"
          tar -xzf _dl/ngx.tar.gz -C _dl --wildcards "*/include"
          rm -rf ext/ngx
          mv _dl/*/include ext/ngx
          test -f ext/ngx/nvsdk_ngx.h
          grep -rq 'NVSDK_NGX_Feature_Reserved18' ext/ngx || {
            echo "::error::Pin drift - no NVSDK_NGX_Feature_Reserved18"; exit 1; }

      - name: Fetch and build MinHook at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/minhook.tar.gz \
            "https://codeload.github.com/TsudaKageyu/minhook/tar.gz/${MINHOOK_SHA}"
          tar -xzf _dl/minhook.tar.gz -C _dl
          rm -rf ext/minhook
          mv _dl/minhook-* ext/minhook
          test -f ext/minhook/include/MinHook.h
          cmake -S ext/minhook -B ext/minhook/build -A x64 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build ext/minhook/build --config Release
          LIB=$(find ext/minhook/build -type f \( -iname 'minhook.x64.lib' -o -iname '*minhook*.lib' \) | head -n1)
          if [ -z "$LIB" ]; then
            echo "::error::no MinHook static library found"
            find ext/minhook/build -type f | sort | head -50 || true
            exit 1
          fi
          echo "discovered MinHook library: $LIB"
          mkdir -p ext/minhook/lib
          cp "$LIB" ext/minhook/lib/MinHook.lib

      # All seven flags are asserted. Only MGPU_NR_RELAY is the variable.
      - name: Configure (nr-relay-ab)
        shell: bash
        run: |
          cmake -B build -A x64 \
            -DMGPU_ARCH_COMPAT=ON \
            -DMGPU_CONTRACT_EXPANDED=ON \
            -DMGPU_NVAPI_EXPLICIT_INIT=OFF \
            -DMGPU_CUDA_DIAG=ON \
            -DMGPU_RESHADE_NATIVE=ON \
            -DMGPU_APPID_NS=OFF \
            -DMGPU_NR_RELAY=ON \
            -DMGPU_MINHOOK_DIR="${{ github.workspace }}/ext/minhook" 2>&1 | tee _cfg.txt

          grep -qi "ARCHTEST variant = COMPAT" _cfg.txt || {
            echo "::error::frozen variable drifted: MGPU_ARCH_COMPAT must be ON"
            grep -ni 'ARCHTEST variant' _cfg.txt || true; exit 1; }
          grep -qi "CREATECONTRACT variant = CONTRACT_EXPANDED" _cfg.txt || {
            echo "::error::frozen variable drifted: MGPU_CONTRACT_EXPANDED must be ON"
            grep -ni 'CREATECONTRACT variant' _cfg.txt || true; exit 1; }
          grep -qi "NVAPIINIT variant = NVAPI_CONTROL" _cfg.txt || {
            echo "::error::frozen variable drifted: MGPU_NVAPI_EXPLICIT_INIT must be OFF"
            grep -ni 'NVAPIINIT variant' _cfg.txt || true; exit 1; }
          grep -qi "CUDADIAG = ON" _cfg.txt || {
            echo "::error::CUDADIAG must be ON - it is the project's baseline instrument"
            grep -ni 'CUDADIAG' _cfg.txt || true; exit 1; }
          grep -qi "RESHADENATIVE = ON" _cfg.txt || {
            echo "::error::frozen variable drifted: MGPU_RESHADE_NATIVE must be ON"
            grep -ni 'RESHADENATIVE' _cfg.txt || true; exit 1; }
          grep -qi "APPID_NS = OFF" _cfg.txt || {
            echo "::error::APPID_NS must stay OFF - the relay has no NGX session of its own"
            grep -ni 'APPID_NS' _cfg.txt || true; exit 1; }
          grep -qi "NR_RELAY = ON" _cfg.txt || {
            echo "::error::MGPU_NR_RELAY did not take - this build would be unchanged"
            grep -ni 'NR_RELAY' _cfg.txt || true; exit 1; }
          grep -q "MinHook library linked from" _cfg.txt || {
            echo "::error::configured WITHOUT MinHook - the arch hook would fail closed"; exit 1; }

          echo "--- all variant lines ---"
          grep -niE 'variant = |CUDADIAG|RESHADENATIVE|APPID_NS|NR_RELAY|MinHook' _cfg.txt || true

      - name: Build
        run: cmake --build build --config Release

      - name: Verify artifact name
        shell: bash
        run: |
          if find build -name 'mgpu_bridge.addon64.dll' -type f | grep -q .; then
            echo "::error::SUFFIX appended to .dll instead of replacing it"; exit 1
          fi
          ADDON=$(find build -name 'mgpu_bridge.addon64' -type f | head -n1)
          if [ -z "$ADDON" ]; then
            echo "::error::mgpu_bridge.addon64 not produced"
            find build -maxdepth 3 -type f || true; exit 1
          fi
          echo "ADDON_PATH=$ADDON" >> "$GITHUB_ENV"
          echo "Output verified: $ADDON"

      # ---------------------------------------------------------------------
      # 5. THE HONEST DESIGN, AND WHETHER IT IS EVEN VISIBLE IN THE ARTIFACT.
      #
      #    TWO STATES, AND THE GATE SAYS WHICH ONE IT IS IN rather than assuming.
      #
      #    NO CALLER YET (today). Nothing calls the relay, so the Release linker
      #    is entitled to drop the module's unreferenced COMDATs - and with them
      #    the string literals only those functions referenced. A string search in
      #    the DLL therefore CANNOT tell "compiled in and linked away" from
      #    "never compiled", and asserting it would be a gate that passes for the
      #    wrong reason or fails for one. What is checked instead is that the
      #    translation unit really was compiled in this configuration: its object
      #    file exists in the build tree.
      #
      #    A CALLER EXISTS (the frame-pipeline phase). Then the module is
      #    referenced, its strings survive into the binary, and the string checks
      #    become meaningful - so they tighten automatically, from the same
      #    workflow, the moment a caller appears.
      #
      #    NOT "FIXED" BY MAKING THE ADD-ON REFERENCE THE MODULE ARTIFICIALLY.
      #    A fake reference to keep a gate green would be worse than the green.
      # ---------------------------------------------------------------------
      - name: Verify the relay is in the build, and in the binary once it is called
        shell: bash
        run: |
          OBJ=$(find build -type f \( -name 'nr_relay.obj' -o -name 'nr_relay.cpp.obj' \) | head -n1)
          [ -n "$OBJ" ] || {
            echo "::error::no nr_relay object in the build tree: the module was NOT compiled,"
            echo "::error::whatever the option said"
            find build -name '*.obj' -type f | head -20 || true
            exit 1
          }
          echo "the module was compiled in this configuration: $OBJ"

          # The strings the relay carries, whatever the run does. -F: these are
          # FIXED strings. As a regex, "[MGPU][RELAY]" is a character class that
          # matches any single one of those letters, so the check would pass on
          # any binary at all and hide the question it is asking.
          STRINGS='[MGPU][RELAY]|CreateFeature(Reserved18) result=|MGPU_NR_|Reserved18|nvngx.dll_mgpu_nr_worker.exe|mgpu\nvngx_dlssnr.dll|not-a-session'

          # Is there a caller? Anything in src/ that is not the module itself and
          # that names one of its entry points.
          #
          # `|| true` IS LOAD-BEARING, and the failure it fixes is invisible: the
          # step runs under bash -e, and with no caller yet the pipeline returns
          # 1. The assignment inherits that status and the step exits SILENTLY
          # right after the object-file line, before the branch below can report
          # which state it is in. The "no caller" state must not fail the gate
          # that exists to handle the "no caller" state.
          CALLERS=$(grep -rlE 'relay::(start|submit|available)\(' src 2>/dev/null \
                    | grep -v '^src/nr_relay\.' | sort | tr '\n' ' ' || true)
          echo "callers of the relay in src/: [${CALLERS:-none}]"

          if [ -z "$CALLERS" ]; then
            echo "STATE: no caller yet, so the linker may legitimately have dropped the"
            echo "module's unreferenced code and its string literals. A string check on"
            echo "$ADDON_PATH would be meaningless here and is NOT performed."
            echo "THE EVIDENCE FOR THIS PHASE IS: the object file above exists (the module"
            echo "compiled), the four source gates above hold, and nr-worker.yml's"
            echo "nr_relay_selftest links this same file with MGPU_NR_RELAY and drives it"
            echo "against a real worker process."
            echo "This gate tightens to the string checks below as soon as a caller appears."
          else
            echo "STATE: the relay IS called from [$CALLERS], so its strings must survive"
            echo "into the artifact. Checking them with -F (fixed strings)."
            IFS='|' read -ra WANT <<< "$STRINGS"
            for S in "${WANT[@]}"; do
              if ! grep -qaF -- "$S" "$ADDON_PATH"; then
                echo "::error::'$S' is not present in $ADDON_PATH even though the relay is called"
                exit 1
              fi
            done
            # The pipe-name prefix: the relay builds \\.\pipe\MGPU_NR_<pid>, and
            # the pid is only known at run time, so the format string is the
            # evidence.
            grep -qaF 'pipe\MGPU_NR_' "$ADDON_PATH" || {
              echo "::error::the pipe-name prefix is not in the binary"; exit 1; }
            echo "relay strings present in the artifact."
          fi

      - name: Verify shipped presets are empty
        shell: bash
        run: |
          FAIL=0
          grep -nE '^\s*Techniques\s*=\s*\S' assets/gpu1.ini && FAIL=1
          grep -n 'DEBUG' assets/gpu1.ini && FAIL=1
          [ "$FAIL" -eq 0 ] || { echo "::error::shipped preset is not clean"; exit 1; }

      - name: Verify shipped config
        shell: bash
        run: |
          grep -qE '^\s*Frames\s*=\s*0\s*$' assets/mgpu.ini || {
            echo "::error::assets/mgpu.ini does not set Frames=0"; exit 1; }
          grep -qE '^\s*Depth\s*=\s*1\s*$' assets/mgpu.ini || {
            echo "::error::assets/mgpu.ini does not set Depth=1"; exit 1; }
          grep -qE '^\s*MVec\s*=\s*3\s*$' assets/mgpu.ini || {
            echo "::error::assets/mgpu.ini does not set MVec=3"; exit 1; }

      # The rename lives here and ONLY here, exactly as build.yml does it.
      - name: Stage deploy set (nr-relay-ab)
        shell: bash
        run: |
          mkdir -p _deploy
          cp "$ADDON_PATH" _deploy/nvngx.dll_mgpu_bridge.addon64
          cp assets/gpu1.ini      _deploy/
          cp assets/mgpu.ini      _deploy/
          cp assets/ReShade2.ini  _deploy/
          cp assets/README.txt    _deploy/
          cp LICENSE              _deploy/
          mkdir -p _deploy/reshade-shaders/Shaders
          cp assets/reshade-shaders/Shaders/mgpu_depth_tap.fx _deploy/reshade-shaders/Shaders/
          find _deploy -type f | sort
          test -f _deploy/nvngx.dll_mgpu_bridge.addon64
          case "$(ls _deploy)" in
            *nvngx.dll_*) ;;
            *) echo "::error::lost the nvngx.dll_ caller-gate prefix"; exit 1 ;;
          esac
          COUNT=$(find _deploy -type f | wc -l)
          [ "$COUNT" -eq 7 ] || {
            echo "::error::_deploy holds $COUNT files, expected 7"
            find _deploy -type f | sort; exit 1; }

      - name: Record the variant marker and hashes
        shell: bash
        run: |
          {
            echo "variant            = nr_relay"
            echo
            echo "THE VARIABLE: MGPU_NR_RELAY=ON compiles src/nr_relay.cpp into the"
            echo "add-on. The module is the GAME-SIDE HALF of the out-of-process"
            echo "neural lane and owns the IPC channel only: it launches"
            echo "  <game>\\bin\\x64\\mgpu\\nvngx.dll_mgpu_nr_worker.exe"
            echo "connects its named pipe, and publishes the four host-staged frame"
            echo "mappings (COLOR, DEPTH, MOTION_VECTORS, OUTPUT)."
            echo
            echo "NOTHING CALLS IT YET. The frame-pipeline call site is a separate"
            echo "piece of work written against src/nr_relay.hpp, so this artifact"
            echo "behaves as the add-on behaves without the module."
            echo
            echo "FROZEN BASELINE - every one asserted at configure time:"
            echo "    MGPU_ARCH_COMPAT=ON"
            echo "    MGPU_CONTRACT_EXPANDED=ON"
            echo "    MGPU_NVAPI_EXPLICIT_INIT=OFF"
            echo "    MGPU_CUDA_DIAG=ON"
            echo "    MGPU_RESHADE_NATIVE=ON"
            echo "    MGPU_APPID_NS=OFF   (the relay creates no NGX session of its own,"
            echo "                         so it must not move any session's app id)"
            echo
            echo "WHY THE FILE NAMES CARRY THE PREFIX: the DLSSNR snippet inspects the"
            echo "module name of its caller and refuses a caller whose file name does"
            echo "not contain \"nvngx.dll\", with 0xBAD00002 - the same code the"
            echo "two-device failure returns, which is how that refusal would be"
            echo "misread as the neural blocker. The worker keeps the prefix for the"
            echo "same reason."
            echo
            echo "WHAT THE GATES PROVED, on this commit:"
            echo "  * the module references no device, no NGX, no NVAPI, no Reserved18"
            echo "    session, and does not include the worker's headers;"
            echo "  * exactly ONE string literal in the module is the word Success, and"
            echo "    it is guarded by a comparison against the worker's own 1;"
            echo "  * the fixed log line is present verbatim:"
            echo "      [MGPU][RELAY] CreateFeature(Reserved18) result=0x%08X (%s) src=worker"
            echo "  * no other printf-style argument list in the module can produce the"
            echo "    word Success;"
            echo "  * the relay's reproduced v1 layout equals tools/nr_worker/nr_proto.h"
            echo "    constant for constant, size for size, offset for offset, and its"
            echo "    pitch arithmetic is pinned;"
            echo "  * THE GEOMETRY CONTRACT IS PER SLOT, and submit() REFUSES a frame that"
            echo "    does not match the slot it is handed to. This is the one that makes"
            echo "    the rest mean anything: the lane's real frame is colour 3840x2160"
            echo "    fmt=28 with motion vectors 1920x1080 fmt=10 in the SAME frame, and a"
            echo "    relay that published one geometry four times would have the worker"
            echo "    read the top rows of a taller buffer and still answer hr == 0 with a"
            echo "    changed output - a PASS on a truncated frame. The refusals are the"
            echo "    row count, the row length (bpp * width, not merely fits the pitch)"
            echo "    and the stride, each naming the slot and both geometries;"
            echo "  * the caller owns the reduction to R. The relay does NOT resample,"
            echo "    crop or pad - the add-on's stream lane already produces its neural"
            echo "    inputs at R, and the relay refuses anything that is not R;"
            echo "  * the strings above are present in the SHIPPED add-on."
            echo
            echo "WHAT THIS DOES NOT CLAIM: NOT A RIG RESULT. GitHub's runners have no"
            echo "NVIDIA adapter, so nothing here created a Reserved18 session, moved"
            echo "a frame through the four mappings, or evaluated an image. This"
            echo "workflow proves COMPILATION and the GATES. The module's behaviour"
            echo "against a real worker process is proved by the nr-worker workflow"
            echo "(nr_relay_selftest against a --protocol-only worker), and the frame"
            echo "round trip needs the rig. The rig cannot run newly built unsigned"
            echo "binaries while Smart App Control is on - a known, separate blocker"
            echo "that this workflow does not attempt to work around."
            echo
            echo "DEPLOY, for a rig run - BOTH files, or the relay stays inert:"
            echo "    <game>\\bin\\x64\\nvngx.dll_mgpu_bridge.addon64   this artifact"
            echo "    <game>\\bin\\x64\\mgpu\\nvngx.dll_mgpu_nr_worker.exe   the worker"
            echo "    <game>\\bin\\x64\\mgpu\\nvngx_dlssnr.dll            the game's runtime"
            echo "The relay pins the runtime by hash when it launches the worker:"
            echo "    4B8D19BC3EFF58A084F5ECA7489C921501C203450169FB82FF4F649A4482BA05"
            echo "which is the GAME's nvngx_dlssnr.dll (310.8.0.0) and NOT the"
            echo "NeuralScreen v2.0.1 build the worker pins by default."
            echo
            echo "commit             = ${GITHUB_SHA}"
            echo "run                = ${GITHUB_RUN_ID}"
            echo "built              = $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "NOT AN A/B. One build, one artifact, no compare job. The CONTROL is"
            echo "the pre-existing behaviour of the add-on with MGPU_NR_RELAY off,"
            echo "which is the default this repository builds."
          } > NR_RELAY_VARIANT.txt
          cat NR_RELAY_VARIANT.txt

          {
            echo "NR_RELAY artifact hashes - nr_relay"
            echo
            echo "Deploy set (7 files):"
            ( cd _deploy && find . -type f | sort | while read f; do
                printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f"
              done )
            echo
            echo "Add-on alone:"
            printf '%s  %s\n' \
              "$(sha256sum _deploy/nvngx.dll_mgpu_bridge.addon64 | awk '{print $1}')" \
              "nvngx.dll_mgpu_bridge.addon64"
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Assert the deploy set is still exactly seven files
        shell: bash
        run: |
          COUNT=$(find _deploy -type f | wc -l)
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::_deploy holds $COUNT files immediately before upload, expected 7"
            find _deploy -type f | sort; exit 1
          fi
          find _deploy -type f | sort
          echo "deploy set is exactly 7 files; metadata stays outside it."

      - uses: actions/upload-artifact@v4
        with:
          name: mgpu_nr_relay
          path: |
            _deploy/
            SHA256SUMS.txt
            NR_RELAY_VARIANT.txt
          if-no-files-found: error

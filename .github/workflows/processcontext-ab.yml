# ============================================================================
# PROCESSCONTEXT-AB - standalone diagnostic build
# ============================================================================
# THIS BUILDS ONE ARTIFACT AND NOTHING ELSE. It does not build the MGPU add-on,
# it does not deploy, it does not touch src/, and it never launches Cyberpunk.
# The diagnostic is its own CMake project under tools/processcontext_ab/, with a
# separate target, so an MGPU regression and a diagnostic regression cannot be
# confused for one another.
#
# THE QUESTION, FIXED IN ADVANCE
#   Does D3D12 device / queue / descriptor state that a process already carries
#   explain why the private NVAPI CUDA-interop calls
#       0x0DDAC234  NvAPI_D3D12_GetCudaIndependentDescriptorObject
#       0xAD1A677D  NvAPI_D3D12_CreateCuModule
#   return NVAPI_ERROR inside Cyberpunk but succeed in NeuralScreen?
#
#   Four arms, each in its own process, each running the same NeuralScreen-
#   equivalent reference lane on the RTX 4070 and differing ONLY in second-
#   adapter state established before that lane starts:
#       single          nothing else at all            (the reference)
#       dual-held       Ti SUPER device held, no NGX, no swapchain
#       dual-active     ... plus a DIRECT queue and a live CBV/SRV/UAV heap
#       dual-released   Ti SUPER device created, recorded, then released
#
#   E) SINGLE does not succeed     -> INVALID, stop, interpret nothing.
#   A) SINGLE ok + DUAL-HELD fails -> simultaneous multi-adapter state suffices.
#   B) A and DUAL-ACTIVE fails     -> an ACTIVE second command/descriptor state.
#   C) DUAL-RELEASED fails         -> process-global NVIDIA state outlives release.
#   D) all four succeed            -> the multi-device hypothesis is EXONERATED.
#
# WHAT THIS JOB REFUSES TO BUILD
#   PROCESSCONTEXT-AB claims to be a pure observer, so the pass-through contract
#   is enforced on the SOURCE rather than trusted. The build fails if the
#   observation layer writes to a caller-owned output, copies memory, reads the
#   blob, retries a call, replaces a status, publishes a real pointer with a
#   plain store instead of a CAS, contains a loop around a genuine call, or
#   contains any return from a wrapper other than the verbatim status and the
#   named unreachable null-guard constant.
#
#   It also fails if the diagnostic references the MGPU add-on's sources at all.
#   A diagnostic that is not standalone cannot be evidence about a standalone
#   question, and a diagnostic that quietly includes MGPU code is a change to
#   MGPU behaviour by another name.
#
# TWO BINARIES, AND WHY THEY ARE SEPARATE
#   The artifact carries processcontext_ab.exe AND holder_ti.exe. The holder is
#   PROCESS A of SPLITPROCESS_ISOLATION: it holds active Ti SUPER D3D12 state in
#   its own process while PROCESS B runs the SINGLE arm.
#
#   The holder is NOT a mode of the diagnostic. Adding one would have changed the
#   executable running the RTX 4070 reference lane, and an isolation experiment
#   whose reference binary changed is not an isolation experiment. So:
#
#     * tools/processcontext_ab/ is FROZEN - this workflow fails unless every file
#       in it is byte-identical to commit 6e2d527, the implementation that
#       produced the known-good PROCESSCONTEXT evidence;
#     * the holder lives only in tools/processcontext_holder/, with no shared
#       source, no NGX headers and no MinHook;
#     * the diagnostic must not contain holder-ti, HOLDER_READY, HOLDER_FAILED,
#       --holder-event or --holder-seconds, and the holder must not contain
#       NVSDK_NGX, nvngx_dlssnr, NvAPI_Initialize or Reserved18. Both are checked
#       in the SOURCE and in the BINARY, so the two cannot have been confused;
#     * every import of the holder is checked: d3d12 and dxgi, and nothing that
#       could reach a neural runtime.
#
# GPU-FREE BEHAVIOURAL TESTS
#   The runners have no NVIDIA adapter, so the four arms cannot be exercised
#   here. Three paths can be, and are: the table path with no logs present, the
#   usage path, and the NR-DLL hash gate with a file that must be REFUSED. The
#   third is the one that matters most: it proves on every build that a wrong
#   snippet build is rejected BEFORE anything is loaded or created.
# ============================================================================

name: processcontext-ab

on:
  workflow_dispatch:
  push:
    # Same dedicated branch as ARCHTEST, CREATECONTRACT, NVAPIINIT, CUDADIAG and
    # RESHADENATIVE. Not main.
    branches: [archtest-ab]
    paths:
      - 'tools/processcontext_ab/**'
      - 'tools/processcontext_holder/**'
      - '.github/workflows/processcontext-ab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NGX_SHA: a291cc7d2cc642a51566f3dfd5376f635cd1b284
  MINHOOK_SHA: c3fcafdc10146beb5919319d0683e44e3c30d537

jobs:
  build:
    runs-on: windows-latest
    name: processcontext-ab
    steps:
      - uses: actions/checkout@v4
        with:
          # The freeze gate below diffs tools/processcontext_ab/ against commit
          # 6e2d527, so the history has to be here.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 0. THE FREEZE. tools/processcontext_ab/ must be the exact implementation
      #    that produced the known-good PROCESSCONTEXT evidence. This is not a
      #    style rule: SPLITPROCESS_ISOLATION compares the SINGLE arm against a
      #    holder in another process, and that comparison is void if the
      #    executable running the lane changed between the two runs.
      #
      #    The check is on the CONTENT HASH OF EACH FILE against the blob id git
      #    holds for commit 6e2d527, which is line-ending independent: a checkout
      #    with core.autocrlf=true and one with it false hash the same here, and
      #    a plain sha256 of the checked-out file would not. A sha256 manifest
      #    was tried first and failed exactly that way - and it would have failed
      #    as a false ALARM on a correct tree, which is worse than no gate.
      # ---------------------------------------------------------------------
      - name: The known-good diagnostic is frozen
        shell: bash
        run: |
          FAIL=0
          CHECKED=0
          while read -r WANT PATHNAME; do
            [ -n "$PATHNAME" ] || continue
            GOT=$(git hash-object -- "$PATHNAME" 2>/dev/null || echo MISSING)
            CHECKED=$((CHECKED + 1))
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$PATHNAME hashes to $GOT, expected the 6e2d527 blob $WANT"
              FAIL=1
            else
              echo "$PATHNAME: OK ($GOT)"
            fi
          done <<'EOF'
          7c080b2c577649bb74f83e551dfb3aa7afd96217 tools/processcontext_ab/CMakeLists.txt
          4b7e2db0f1fea75c67d52fb512fe34e0a9c9e3ad tools/processcontext_ab/README.txt
          fc6ce467e961b8567544ba8fa41f9518a96b4ddd tools/processcontext_ab/RUN-CONTEXT-AB.cmd
          12ccdd26dd6be85e0e0777f411f956a0f2f96d72 tools/processcontext_ab/main.cpp
          23ba2bcf7129c1412e4ec9a7637fd8b5fea4e736 tools/processcontext_ab/nv.cpp
          5fb039e843bd3abef689e8722eaa4541a094d265 tools/processcontext_ab/nv.h
          b292b5da088f8fb777d9e259fe5cb5b5b56da1eb tools/processcontext_ab/observe.cpp
          d6b99ab0b126e4805811df24e2998d839d831856 tools/processcontext_ab/observe.hpp
          EOF
          # A walk that checked nothing would report nothing wrong.
          [ "$CHECKED" -eq 8 ] || {
            echo "::error::the freeze gate checked $CHECKED file(s), expected 8"; exit 1; }
          [ "$FAIL" -eq 0 ] || {
            echo "::error::tools/processcontext_ab/ is no longer the known-good implementation."
            exit 1; }

          # Exactly these files and no others: a new file in the directory is a
          # change to the diagnostic even before anything compiles it.
          FOUND=$(cd tools/processcontext_ab && ls -1 | sort | tr '\n' ' ')
          WANT="CMakeLists.txt README.txt RUN-CONTEXT-AB.cmd main.cpp nv.cpp nv.h observe.cpp observe.hpp "
          [ "$FOUND" = "$WANT" ] || {
            echo "::error::tools/processcontext_ab/ holds [$FOUND], expected [$WANT]"; exit 1; }

          # And the same statement in git's terms, against the commit that
          # produced the evidence: no modification, no addition, no deletion.
          git diff --exit-code 6e2d527 -- tools/processcontext_ab || {
            echo "::error::tools/processcontext_ab/ differs from 6e2d527"; exit 1; }
          git diff --cached --exit-code 6e2d527 -- tools/processcontext_ab || {
            echo "::error::the staged tools/processcontext_ab/ differs from 6e2d527"; exit 1; }
          echo "freeze verified: all 8 files hash to their 6e2d527 blobs and git reports no difference."

      # ---------------------------------------------------------------------
      # 0b. THE HOLDER IS CONTAINED. Whatever the holder is, it is here and only
      #     here, and it can reach nothing.
      # ---------------------------------------------------------------------
      - name: The holder is contained
        shell: bash
        run: |
          test -d tools/processcontext_holder
          for F in main.cpp CMakeLists.txt README.txt; do
            test -f "tools/processcontext_holder/$F" || {
              echo "::error::missing tools/processcontext_holder/$F"; exit 1; }
          done

          # Exactly these three files and no others: a new file here is new
          # behaviour in PROCESS A, and PROCESS A is supposed to do five things.
          FOUND=$(cd tools/processcontext_holder && ls -1 | sort | tr '\n' ' ')
          WANT="CMakeLists.txt README.txt main.cpp "
          [ "$FOUND" = "$WANT" ] || {
            echo "::error::tools/processcontext_holder/ holds [$FOUND], expected [$WANT]"; exit 1; }

          # The holder must not reach out of its own directory, and must not
          # include the diagnostic it is deliberately independent of. The FILE
          # NAME is stripped first: this directory is called
          # processcontext_holder, so matching the path would match everything.
          H=$(grep -rnE '^[[:space:]]*#include' tools/processcontext_holder \
                | sed 's/^[^:]*:[0-9]*://' \
                | grep -E '\.\./|processcontext|nv\.h|observe|MinHook|nvsdk|nvapi' || true)
          [ -z "$H" ] || {
            echo "$H"; echo "::error::the holder includes something outside its own directory"; exit 1; }

          # NO NEURAL RUNTIME, AND NO WAY TO CALL ONE - asserted on the CODE, with
          # the comments stripped, because those comments name these things in
          # order to disclaim them. The stripped copies go to a temp directory so
          # that the token gate below cannot find them and report itself.
          TMPD=$(mktemp -d)
          sed 's|//.*$||' tools/processcontext_holder/main.cpp > "$TMPD/main.txt"
          sed 's/#.*$//'   tools/processcontext_holder/CMakeLists.txt > "$TMPD/cmake.txt"
          RC=0
          for S in NVSDK_NGX nvngx_dlssnr NvAPI_Initialize Reserved18 nvapi64 nvapi \
                   MinHook GetProcAddress LoadLibrary; do
            H=$(grep -n -- "$S" "$TMPD/main.txt" "$TMPD/cmake.txt" || true)
            if [ -n "$H" ]; then
              echo "$H"; echo "::error::'$S' appears in the holder's code"; RC=1
            fi
          done
          rm -rf "$TMPD"
          [ "$RC" -eq 0 ] || exit 1

          # The holder must NOT have grown an NGX or MinHook option: an option to
          # point it at those trees is a dependency waiting to be switched on.
          grep -q 'target_link_libraries(holder_ti PRIVATE' tools/processcontext_holder/CMakeLists.txt || {
            echo "::error::the holder does not declare its link libraries"; exit 1; }
          # And the libraries it declares are d3d12 and dxgi, exactly.
          LIBS=$(awk '/target_link_libraries\(holder_ti PRIVATE/,/\)/' \
                   tools/processcontext_holder/CMakeLists.txt \
                 | grep -oE '^[[:space:]]+[A-Za-z0-9_]+' | tr -d ' ' | sort | tr '\n' ' ')
          [ "$LIBS" = "d3d12 dxgi " ] || {
            echo "::error::the holder links [$LIBS], expected [d3d12 dxgi ]"; exit 1; }
          echo "holder contained: no neural runtime, no NVAPI, no detour library, no dynamic loading, no diagnostic source, no climbing include, and d3d12 + dxgi only."

      # ---------------------------------------------------------------------
      # 0c. HOLDER FUNCTIONALITY EXISTS ONLY HERE. The holder's own protocol
      #     tokens must not have leaked into any other source in the repository.
      #     tools/autolab/ is the DRIVER: it waits for the tokens and names the
      #     executable, so it is the one permitted place outside this directory.
      #
      #     Vendored downloads, build trees, caches and run outputs are excluded:
      #     they are not sources and they are not in a clean checkout anyway.
      # ---------------------------------------------------------------------
      - name: Holder tokens exist only in the holder and its driver
        shell: bash
        run: |
          ALLOW='^tools/processcontext_holder/|^tools/autolab/|^\.github/workflows/'
          SKIP='--exclude-dir=.git --exclude-dir=ext --exclude-dir=_dl --exclude-dir=results
                --exclude-dir=cache --exclude-dir=__pycache__ --exclude-dir=build-pcab
                --exclude-dir=build-holder'
          BAD=0
          for S in HOLDER_READY HOLDER_FAILED HOLDER_STOPPED holder_ti --holder-event --holder-seconds; do
            H=$(grep -rn \
                  --include='*.cpp' --include='*.h' --include='*.hpp' --include='*.c' \
                  --include='*.py' --include='*.cmd' --include='*.bat' --include='*.txt' \
                  --include='*.yml' --include='*.yaml' --include='*.md' --include='CMakeLists.txt' \
                  $SKIP -- "$S" . \
                | sed 's|^\./||' | grep -vE "$ALLOW" || true)
            if [ -n "$H" ]; then
              echo "$H"
              echo "::error::'$S' appears outside the holder and its driver"
              BAD=1
            fi
          done
          [ "$BAD" -eq 0 ] || exit 1
          echo "holder tokens are confined to tools/processcontext_holder/ and the driver."

      # ---------------------------------------------------------------------
      # 1. The diagnostic must be standalone. If it reaches into the add-on,
      #    then "PROCESSCONTEXT-AB changed nothing about MGPU" stops being true
      #    by construction rather than by intent.
      # ---------------------------------------------------------------------
      - name: The diagnostic is standalone
        shell: bash
        run: |
          test -d tools/processcontext_ab
          for F in main.cpp nv.cpp nv.h observe.cpp observe.hpp CMakeLists.txt README.txt RUN-CONTEXT-AB.cmd; do
            test -f "tools/processcontext_ab/$F" || { echo "::error::missing tools/processcontext_ab/$F"; exit 1; }
          done

          # No include that climbs out of the directory, and no reference to any
          # add-on translation unit or header.
          H=$(grep -rnE '#include[[:space:]]*"\.\./|#include[[:space:]]*<\.\./' tools/processcontext_ab || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::the diagnostic includes a path outside its own directory"; exit 1; }

          H=$(grep -rnE 'gpu1_context|arch_test\.(cpp|hpp)|reshade_native|cuda_diag|create_contract|adapter\.hpp|mgpu::' tools/processcontext_ab || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::the diagnostic references MGPU add-on sources"; exit 1; }

          # And the add-on must not have grown a reference to the diagnostic.
          H=$(grep -rnE 'processcontext_ab|PROCESSCONTEXT|PCAB_' src CMakeLists.txt assets 2>/dev/null || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::the MGPU add-on references the diagnostic"; exit 1; }
          echo "standalone verified: no MGPU reference in either direction."

      # ---------------------------------------------------------------------
      # 2. The pass-through contract, on the source.
      # ---------------------------------------------------------------------
      - name: Verify the observation layer is a pass-through
        shell: bash
        run: |
          F=tools/processcontext_ab/observe.cpp

          # The two ids this diagnostic exists to observe must be the public,
          # documented values, and the caller's arithmetic must be the
          # documented 48-byte structure.
          grep -q '0x0DDAC234u' tools/processcontext_ab/nv.h || { echo "::error::the descriptor id is not the documented 0x0DDAC234"; exit 1; }
          grep -q '0xAD1A677Du' tools/processcontext_ab/nv.h || { echo "::error::the CuModule id is not the documented 0xAD1A677D"; exit 1; }
          grep -qE 'static_assert\(sizeof\(GetDescParams\) == 48' "$F" || { echo "::error::the 48-byte descriptor-params contract is not asserted"; exit 1; }

          # Every id printed goes through one zero-padded formatter. The observer
          # work this descends from had a real bug where 0x150e828 was compared
          # against a zero-padded 0x0150e828, and it is not being reintroduced.
          grep -qE 'void id_hex\(unsigned id, char out\[11\]\)' "$F" || { echo "::error::the zero-padded id formatter is missing"; exit 1; }
          H=$(grep -nE '0x150e828|0x150E828' "$F" || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::an unpadded NvAPI_Initialize id literal is present"; exit 1; }

          FAIL=0
          note() { echo "::error::$1"; FAIL=1; }
          # hits() drops comment-only lines, so a comment that mentions a word
          # cannot fail the build and a real statement cannot pass it. It also
          # fails the build if grep itself errors, so a malformed pattern cannot
          # silently verify nothing.
          hits() {
            local raw rc out
            raw=$(grep -nE "$1" "$F"); rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::the gate's own grep failed (exit $rc) on pattern: $1"; exit 1
            fi
            if [ "$rc" -eq 1 ]; then printf ''; return 0; fi
            out=$(printf '%s\n' "$raw" | grep -vE '^[0-9]+:[ \t]*(//|\*|/\*)' || true)
            printf '%s' "$out"
          }

          # ---- exactly two genuine calls, each unconditional ----------------
          # Written as the initialiser of `status`, so each call happens exactly
          # once, with the original arguments, on every path that reaches it.
          CALLS=$(grep -cE 'const int status = real\(' "$F" || true)
          [ "$CALLS" -eq 2 ] || { note "expected exactly 2 genuine calls (found $CALLS)"; }
          V=$(grep -cE '^[ \t]*return status;' "$F" || true)
          [ "$V" -eq 2 ] || { note "expected exactly 2 verbatim status returns (found $V)"; }
          G=$(grep -cE '^[ \t]*return NVAPI_ERROR_UNREACHABLE;' "$F" || true)
          [ "$G" -eq 2 ] || { note "expected exactly 2 unreachable null-guard returns (found $G)"; }
          grep -qE 'const int NVAPI_ERROR_UNREACHABLE = -1;' "$F" || note "the null-guard constant is not defined as -1"

          # The two wrappers, isolated. Every return-count check below is scoped
          # to THIS text, because the rest of the file legitimately returns too
          # (the installer, the resolver, the summary) and a file-wide count
          # would be meaningless.
          W=$(awk '/^    int __cdecl wrap_get_desc/,/^    void \*__cdecl query_detour/' "$F")
          [ -n "$W" ] || { echo "::error::could not isolate the two wrappers"; exit 1; }
          WCODE=$(printf '%s\n' "$W" | grep -vE '^[ \t]*(//|\*|/\*)' || true)
          WR=$(printf '%s\n' "$WCODE" | grep -cE '\breturn\b' || true)
          [ "$WR" -eq 4 ] || {
            note "the wrappers hold $WR returns; exactly 4 are permitted (2 verbatim + 2 guards)"
            printf '%s\n' "$WCODE" | grep -nE '\breturn\b' || true
          }

          # No arithmetic, negation or numeric literal in a wrapper return: a
          # rewritten status would look exactly like one.
          H=$(printf '%s\n' "$WCODE" | grep -nE 'return\s+(status\s*[-+*/%]|!status|-[0-9]|[0-9]|0x)' || true)
          [ -z "$H" ] || { echo "$H"; note "a status is not returned verbatim"; }

          # ---- no writes to caller-owned memory ----------------------------
          H=$(hits '\*\s*phModule\s*=[^=]')
          [ -z "$H" ] || { echo "$H"; note "writes *phModule, a caller-owned __out"; }
          H=$(hits 'p->(structSizeIn|structSizeOut|pDevice|type|desc|handle)\s*=[^=]')
          [ -z "$H" ] || { echo "$H"; note "writes a caller-owned field of pParams"; }
          H=$(hits 'memcpy|memmove|memset|memcmp')
          [ -z "$H" ] || { echo "$H"; note "copies or compares memory"; }
          H=$(hits 'pBlob\s*\[|pBlob\s*\+|pBlob\s*->|\(\*pBlob\)')
          [ -z "$H" ] || { echo "$H"; note "inspects the blob"; }
          # The blob's SIZE may be recorded; the blob's CONTENTS may never be.
          grep -qE 'first_cu_blob_size|g_first_blob_size' "$F" || note "the blob-size observation is missing"
          grep -qF '(pointer only; ' "$F" || note "the log does not state that pBlob is a pointer only"
          grep -qF 'never dereferenced' "$F" || note "the log does not state that pBlob is never dereferenced"

          # ---- a failed __out value is never read --------------------------
          # The read must be gated on the status, and the guard must be in the
          # same conditional chain, so there is no path that reads it on failure.
          grep -qF 'NOT READ: NvApi_Status != NVAPI_OK' "$F" || note "the 'not read on failure' wording is missing"
          grep -qE 'if \(status != 0\)[ \t]*handle_note' "$F" || note "the descriptor read is not gated on the status"
          grep -qE 'if \(status != 0\)[ \t]*note' "$F" || note "the module-handle read is not gated on the status"

          # ---- real-pointer publication is a CAS, never a store ------------
          CAS=$(grep -cE 'g_real_(desc|cu)\.compare_exchange_strong\(' "$F" || true)
          [ "$CAS" -eq 2 ] || { note "expected 2 publication CASes, found $CAS"; }
          H=$(hits 'g_real_(desc|cu)\s*\.\s*store\s*\(')
          [ -z "$H" ] || { echo "$H"; note "publishes a real pointer with a plain store"; }
          grep -qE 'std::memory_order_release,' "$F" || note "the CAS success ordering is not release"
          grep -qE 'std::memory_order_acquire\)\)' "$F" || note "the CAS failure ordering is not acquire"
          grep -qE 'UNWRAPPED, so behaviour is unchanged' "$F" || note "the different-pointer path does not state that behaviour is unchanged"

          # ---- no loop around a genuine call ------------------------------
          # Scoped to the two wrappers: log_stack() legitimately loops to print
          # the stack, and it never calls into NVAPI.
          H=$(printf '%s\n' "$W" | grep -nE '\b(for|while)\s*\(|\bdo\s*\{' || true)
          [ -z "$H" ] || { echo "$H"; note "a genuine call sits inside a loop"; }

          # ---- the device identity is compared, and never asserted ---------
          # The requirement is observation equivalent to CUDADIAG, and the
          # property CUDADIAG is most careful about here is that a null device is
          # only a negative MATCH when there is something to match it against.
          grep -qF 'match=NOT_COMPARED' "$F" || note "the no-comparison device state is missing"
          grep -qE 'if \(!g_expected_known\.load\(std::memory_order_acquire\)\) return "match=NOT_COMPARED";' "$F" ||
            note "the device comparison is not gated on a published identity"
          NM=$(grep -nF 'match=no' "$F" | grep -vE ':[ \t]*(//|\*|/\*)' | grep -c . || true)
          [ "$NM" -eq 1 ] || {
            note "expected exactly 1 code 'match=no' in observe.cpp, found $NM"
            grep -nF 'match=no' "$F" || true
          }
          grep -qF 'g_expected_known.store(true, std::memory_order_release)' "$F" ||
            note "the expected-device flag is not published with release after its payload"
          grep -qF 'observe_set_expected_device' tools/processcontext_ab/observe.hpp ||
            note "observe_set_expected_device is not declared"
          grep -qF 'pcab::observe_set_expected_device((void *)lane.dev);' tools/processcontext_ab/main.cpp ||
            note "the lane device is never published to the observer"
          # Published BEFORE the observer is installed. It is deliberately NOT
          # asserted to precede NvAPI_Initialize any more: the observer is now
          # installed as late as it can be - after NVAPI init, the architecture
          # cache and the arch patch, and before the private runtime loads - so
          # that it cannot perturb core Init or the architecture setup. The
          # order assertions for that live in the reference-contract step.
          PUB=$(grep -n 'pcab::observe_set_expected_device' tools/processcontext_ab/main.cpp | head -n1 | cut -d: -f1)
          INSD=$(grep -n 'pcab::observe_install(mode)' tools/processcontext_ab/main.cpp | head -n1 | cut -d: -f1)
          [ -n "$PUB" ] && [ -n "$INSD" ] && [ "$PUB" -lt "$INSD" ] || {
            echo "::error::the device identity is published after the observer is installed (pub $PUB, install $INSD)"; exit 1; }

          # ---- the hook is on the resolver, and there is exactly one ------
          N=$(grep -cE 'MH_CreateHook\(entry, \(LPVOID\)&query_detour' "$F" || true)
          [ "$N" -eq 1 ] || { note "expected exactly 1 MH_CreateHook(&query_detour), found $N"; }
          grep -qF 'nvapi_QueryInterface' "$F" || note "the resolver hook is not on nvapi_QueryInterface"
          grep -qF 'the TRAMPOLINE, not the patched entry' "$F" || note "the original pointer is not taken from MinHook's trampoline"
          # A probe is not a result, and that distinction must be in the code.
          grep -qF 'null-argument validation probe; ' "$F" || note "the probe classification wording is missing"
          # A probe is not a result, and the separation must be STRUCTURAL:
          # separate storage per kind, with exactly one writer each, so no
          # arithmetic can move a probe's status into a real result.
          N=$(grep -cE 'std::atomic<int> g_(desc|cu)_(real|probe)_status' "$F" || true)
          [ "$N" -eq 4 ] || { note "expected 4 separate real/probe status slots, found $N"; }
          for S in 'record_real(g_desc_real_status' 'record_real(g_cu_real_status' \
                   'record_probe(g_desc_probe_status' 'record_probe(g_cu_probe_status'; do
            C=$(grep -cF "$S" "$F" || true)
            [ "$C" -eq 1 ] || { note "expected exactly 1 '$S', found $C"; }
          done
          grep -qF 'read_status(g_desc_real_status)' "$F" || note "the summary does not read the real descriptor slot"
          grep -qF 'read_status(g_cu_real_status)' "$F" || note "the summary does not read the real cumodule slot"
          # The old shape, which reported a probe's status as a real one, must be gone.
          H=$(hits 'descriptor_calls > s\.descriptor_probes|cumodule_calls > s\.cumodule_probes')
          [ -z "$H" ] || { echo "$H"; note "the superseded probe-count arithmetic is back"; }

          # A null resolver answer is returned UNCHANGED, for both ids.
          N=$(grep -cF 'if (answer == nullptr)' "$F" || true)
          [ "$N" -eq 2 ] || { note "expected 2 null-answer guards on the resolver, found $N"; }
          N=$(grep -cF 'No wrapper is manufactured for' "$F" || true)
          [ "$N" -eq 2 ] || { note "expected 2 'no wrapper is manufactured' statements, found $N"; }

          [ "$FAIL" -eq 0 ] || exit 1
          echo "pass-through verified: two unconditional calls, verbatim statuses, no output write, no blob read, no retry."

      # ---------------------------------------------------------------------
      # 3. NVAPI bring-up and the architecture patch.
      # ---------------------------------------------------------------------
      - name: Verify the NVAPI ordering and the architecture patch
        shell: bash
        run: |
          F=tools/processcontext_ab/nv.cpp
          # NvAPI_Initialize must be the FIRST id resolved through the resolver.
          FIRST=$(grep -n 'g_query(' "$F" | head -n1)
          case "$FIRST" in
            *NVAPI_ID_INITIALIZE*) echo "first resolver call: $FIRST" ;;
            *) echo "::error::the first id resolved is not NvAPI_Initialize: $FIRST"; exit 1 ;;
          esac
          # The spoof must be conditional: a real value that is already accepted
          # is not rewritten, which is NeuralScreen's behaviour.
          grep -qF 'const bool spoofing = (e->spoof && out.architecture != SPOOF_ARCHITECTURE);' "$F" || {
            echo "::error::the architecture rewrite is unconditional"; exit 1; }
          grep -q 'SPOOF_ARCHITECTURE   = 0x1B0u' tools/processcontext_ab/nv.h || {
            echo "::error::the accepted architecture value has drifted"; exit 1; }
          # A KNOWN cached handle is served FROM THE CACHE. The real function
          # must not be called for one: calling through would let the variable
          # under test - a live second D3D12 device - feed back into the
          # architecture query after the reference values were read.
          #
          # Enforced structurally: the ONLY call to the real entry point in this
          # file is the UNKNOWN-handle passthrough.
          N=$(grep -c 'g_arch_original(' "$F" || true)
          [ "$N" -eq 1 ] || {
            echo "::error::expected exactly 1 call to the genuine GetArchInfo (the unknown-handle passthrough), found $N"
            grep -n 'g_arch_original(' "$F" || true; exit 1; }
          grep -qF 'return g_arch_original(gpu, pInfo);' "$F" || {
            echo "::error::the unknown-handle passthrough does not return the genuine call"; exit 1; }
          grep -qF 'UNKNOWN handle' "$F" || {
            echo "::error::the unknown-handle path does not log UNKNOWN"; exit 1; }
          grep -qF 'PASSTHROUGH to the genuine GetArchInfo' "$F" || {
            echo "::error::the unknown-handle path does not log PASSTHROUGH"; exit 1; }
          # The known-handle path: the caller's version stamp is saved, the cache
          # is copied, the stamp is restored, and NVAPI_OK is returned.
          grep -qF 'const unsigned requested = pInfo->version;' "$F" || {
            echo "::error::the caller's requested version stamp is not saved"; exit 1; }
          grep -qF 'out.version = requested;' "$F" || {
            echo "::error::the caller's requested version stamp is not restored"; exit 1; }
          grep -qF 'return NVAPI_OK_STATUS;' "$F" || {
            echo "::error::the cached path does not return NVAPI_OK"; exit 1; }
          grep -qF 'const bool spoofing = (e->spoof && out.architecture != SPOOF_ARCHITECTURE);' "$F" || {
            echo "::error::the spoof is not gated on the target entry AND its real generation needing it"; exit 1; }
          grep -qF 'ITS OWN cached real result' "$F" || {
            echo "::error::the non-target path does not state that it returns the cached real value"; exit 1; }
          # Per-GPU: a cache filled before the hook, one spoof target.
          grep -qF 'e.spoof = (g_arch_target_set && e.raw_pci != 0 && e.raw_pci == g_arch_target_raw);' "$F" || {
            echo "::error::the spoof target is not selected by exact raw PCI identity"; exit 1; }
          # The NR DLL is hashed through CNG, not a hand-rolled digest.
          grep -q 'BCryptOpenAlgorithmProvider(&alg, BCRYPT_SHA256_ALGORITHM' "$F" || {
            echo "::error::the SHA256 is not computed with CNG"; exit 1; }

      # ---------------------------------------------------------------------
      # 4. The four arms and the fixed interpretation.
      # ---------------------------------------------------------------------
      - name: Verify the arms and the fixed interpretation
        shell: bash
        run: |
          F=tools/processcontext_ab/main.cpp

          # Adapters are identified by PCI device id. There is no ordinal
          # selection anywhere, which is what makes the four arms comparable.
          grep -q 'PCI_TI_SUPER  = 0x2705u' "$F" || { echo "::error::the Ti SUPER device id is not 10DE:2705"; exit 1; }
          grep -q 'PCI_RTX_4070  = 0x2786u' "$F" || { echo "::error::the RTX 4070 device id is not 10DE:2786"; exit 1; }
          A=$(grep -c 'd.DeviceId == PCI_TI_SUPER' "$F" || true)
          B=$(grep -c 'd.DeviceId == PCI_RTX_4070' "$F" || true)
          [ "$A" -eq 1 ] && [ "$B" -eq 1 ] || { echo "::error::expected one device-id selection per adapter (found $A and $B)"; exit 1; }
          H=$(grep -nE 'EnumAdapters1\([[:space:]]*[0-9]' "$F" || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::an adapter is selected by a literal ordinal"; exit 1; }

          # The four arms exist under exactly these names.
          grep -qF 'MODE_NAMES[4] = { "single", "dual-held", "dual-active", "dual-released" }' "$F" || {
            echo "::error::the four arm names are not the fixed ones"; exit 1; }

          # The snippet build is gated on its hash, before it is loaded.
          grep -qF 'dcc0dc2414aedec4a8e084647070383be068554042587180c20c784d4772d36f' "$F" || {
            echo "::error::the required NR DLL SHA256 is missing"; exit 1; }
          GATE=$(grep -n 'EXPECTED_NR_SHA256' "$F" | head -n1 | cut -d: -f1)
          LOAD=$(grep -n 'ngx_load_snippet' "$F" | head -n1 | cut -d: -f1)
          [ -n "$GATE" ] && [ -n "$LOAD" ] && [ "$GATE" -lt "$LOAD" ] || {
            echo "::error::the hash gate does not precede the snippet load (gate $GATE, load $LOAD)"; exit 1; }

          # The five fixed rules, one per arm, in the fixed order.
          for S in 'E) INVALID' 'A) SINGLE succeeded and DUAL-HELD failed.' \
                   'B) SINGLE and DUAL-HELD succeeded, DUAL-ACTIVE failed.' \
                   'C) SINGLE, DUAL-HELD and DUAL-ACTIVE succeeded, DUAL-RELEASED failed.' \
                   'D) ALL FOUR ARMS SUCCEEDED.'; do
            grep -qF "$S" "$F" || { echo "::error::the fixed interpretation is missing: $S"; exit 1; }
          done
          # E is decided before anything else.
          EL=$(grep -n 'E) INVALID' "$F" | head -n1 | cut -d: -f1)
          AL=$(grep -n 'A) SINGLE succeeded and DUAL-HELD failed.' "$F" | head -n1 | cut -d: -f1)
          DL=$(grep -n 'D) ALL FOUR ARMS SUCCEEDED.' "$F" | head -n1 | cut -d: -f1)
          [ "$EL" -lt "$AL" ] && [ "$AL" -lt "$DL" ] || {
            echo "::error::the interpretation is not in the fixed E, A, B, C, D order"; exit 1; }

          # The caller-gate name check exists and warns loudly, because a run
          # that skips it fails SINGLE for an unrelated reason.
          grep -qF 'std::strstr(self_name, "nvngx.dll")' "$F" || {
            echo "::error::the nvngx.dll caller-gate name check is missing"; exit 1; }
          grep -qF 'the whole diagnostic is INVALID (rule E)' "$F" || {
            echo "::error::the caller-gate warning does not say the diagnostic would be INVALID"; exit 1; }

          # Each arm writes its own per-mode log.
          grep -qF 'std::snprintf(g_log_path, sizeof g_log_path, "context-%s.log", mode_name);' \
            tools/processcontext_ab/nv.cpp || {
            echo "::error::the per-mode log file naming has changed"; exit 1; }

      # ---------------------------------------------------------------------
      # 5. The launcher. The rename is the whole reason the launcher exists.
      # ---------------------------------------------------------------------
      - name: Verify the launcher
        shell: bash
        run: |
          F=tools/processcontext_ab/RUN-CONTEXT-AB.cmd
          grep -qF 'set "RUNNAME=nvngx.dll_processcontext_ab.exe"' "$F" || {
            echo "::error::the launcher does not run the exe under a name carrying the nvngx.dll prefix"; exit 1; }
          grep -qF 'copy /y "%EXE%" "%RUNNAME%"' "$F" || {
            echo "::error::the launcher does not create the prefixed copy"; exit 1; }
          grep -qF 'for %%M in (single dual-held dual-active dual-released) do' "$F" || {
            echo "::error::the launcher does not run the four arms in the fixed order"; exit 1; }
          grep -qF -- '"%RUNNAME%" --mode %1 --nr-dll "%NRDLL%"' "$F" || {
            echo "::error::each arm is not launched as its own process with the NR DLL"; exit 1; }
          grep -qF -- '"%EXE%" --mode table' "$F" || {
            echo "::error::the launcher does not print the fixed table"; exit 1; }
          # THE OPTIONAL ARM LIST. With no arm names the script must still run
          # the four arms in the fixed order and print the table - that is the
          # documented invocation. With arm names it must run ONLY those, which is
          # what lets an orchestrator enforce SINGLE as a gate.
          grep -qF 'set "FIRSTARM=%~2"' "$F" || {
            echo "::error::the launcher does not read an optional arm list"; exit 1; }
          grep -qF 'for %%M in (single dual-held dual-active dual-released) do call :pcab_arm %%M' "$F" || {
            echo "::error::the default invocation no longer runs the four arms in the fixed order"; exit 1; }
          grep -qF 'for %%M in (%ARMS%) do call :pcab_arm %%M' "$F" || {
            echo "::error::the launcher cannot run an explicit arm list"; exit 1; }
          grep -qF 'if not "%EXPLICIT%"=="" goto :pcab_explicit' "$F" || {
            echo "::error::the two run paths are not separated by a goto"; exit 1; }
          grep -qF ':pcab_arm' "$F" || {
            echo "::error::the single-arm subroutine is gone"; exit 1; }
          # cmd.exe closes a parenthesised block at the first unescaped ")" -
          # including one inside an echo - which silently truncates the block and
          # lets the other branch run. The launcher was bitten by exactly that,
          # so parenthesised blocks are not used for the two run paths at all.
          N=$(grep -c ') else (' "$F" || true)
          [ "$N" -eq 0 ] || {
            echo "::error::the launcher uses a parenthesised if/else block; an echo containing ')' there truncates it"; exit 1; }
          echo "launcher verified: four arms, one process each, prefixed name, fixed table, optional arm list."
          # The launcher must not launch the game and must not deploy. It NAMES
          # Cyberpunk in a note saying it was not launched, so the check is for
          # the game's executable and for deployment verbs, not for the word.
          H=$(grep -niE 'Cyberpunk2077|start[[:space:]]+.*\.exe|addon64|xcopy|robocopy|Program Files' "$F" || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::the launcher launches or deploys something"; exit 1; }
          # CRLF: a batch file with bare LF line endings is not reliably parsed.
          CRLF=$(grep -c $'\r' "$F" || true)
          [ "$CRLF" -ge 30 ] || { echo "::error::$F has only $CRLF CR-terminated lines - it is not CRLF"; exit 1; }

      # ---------------------------------------------------------------------
      # 6. Structural substitutes for a compiler, which the rig these sources
      #    are written on does not have. The preprocessor nesting and the brace
      #    balance are the two errors that a diff review cannot see.
      #
      #    The brace count is taken with `//` comments stripped. That is exact
      #    here rather than approximate: no string literal and no comment in
      #    these five files contains a brace, and the gate below asserts that,
      #    so the count cannot be thrown off by prose.
      # ---------------------------------------------------------------------
      - name: Structural checks
        shell: bash
        run: |
          FAIL=0
          for F in tools/processcontext_ab/main.cpp tools/processcontext_ab/nv.cpp \
                   tools/processcontext_ab/observe.cpp tools/processcontext_ab/nv.h \
                   tools/processcontext_ab/observe.hpp; do
            test -f "$F" || { echo "::error::missing $F"; exit 1; }

            awk '
              /^[ \t]*#[ \t]*(ifdef|ifndef|if)\b/ { depth++ }
              /^[ \t]*#[ \t]*endif\b/            { depth--; if (depth < 0) neg = 1 }
              END {
                if (depth != 0 || neg) {
                  printf "::error::%s preprocessor nesting does not close (depth=%d, underflow=%d)\n", FILENAME, depth, neg
                  exit 1
                }
              }
            ' "$F" || exit 1

            # Brace balance. Braces inside string literals and inside `//`
            # comments are skipped by the same character walk that counts them,
            # including a backslash-escaped quote - so the count is a fact about
            # the code and not about the prose in it. (GNU awk; `sub(/\/\/.*$/)`
            # alone would NOT be enough, because the closing quote of a string is
            # followed by whatever code comes after it.)
            awk '
              {
                line = $0
                instr = 0
                for (i = 1; i <= length(line); i++) {
                  c = substr(line, i, 1)
                  if (instr) {
                    if (c == "\\") { i++; continue }
                    if (c == "\"") instr = 0
                    continue
                  }
                  if (c == "\"") { instr = 1; continue }
                  if (c == "/" && substr(line, i + 1, 1) == "/") break
                  if (c == "{") depth++
                  else if (c == "}") { depth--; if (depth < 0) neg = 1 }
                }
              }
              END {
                if (depth != 0 || neg) {
                  printf "::error::%s brace imbalance (depth=%d, underflow=%d) - a missing or extra brace\n", FILENAME, depth, neg
                  exit 1
                }
              }
            ' "$F" || exit 1

            # Positive control for the walk above: it must SEE the braces it is
            # counting. A walk that skipped everything would report every file as
            # balanced, which is exactly the failure mode a brace check exists to
            # prevent.
            NB=$(grep -c '{' "$F" || true)
            [ "$NB" -ge 2 ] || { echo "::error::$F has only $NB opening braces - the brace count is not seeing the code"; exit 1; }

            echo "$F: nesting closes, braces balance"
          done

          # No conditional compilation at all in the diagnostic: the arms differ
          # by RUNTIME state, never by a compile-time switch. A #if in these
          # files would mean two different binaries claim to be one experiment.
          H=$(grep -nE '^[ \t]*#[ \t]*(if|ifdef|ifndef|else|elif)' \
                tools/processcontext_ab/main.cpp tools/processcontext_ab/nv.cpp \
                tools/processcontext_ab/observe.cpp tools/processcontext_ab/nv.h \
                tools/processcontext_ab/observe.hpp || true)
          [ -z "$H" ] || { echo "$H"; echo "::error::the diagnostic contains conditional compilation"; FAIL=1; }

          [ "$FAIL" -eq 0 ] || exit 1
          echo "structural checks passed."

      # ---------------------------------------------------------------------
      # THE SOURCE-CONTRACT GATE.
      #
      # The stale-experiment problem this exists to prevent: the tree once
      # carried a PROCESSCONTEXT whose control lane did not reproduce
      # NeuralScreen at all - app id 0, the core's shared capability block
      # instead of a private AllocateParameters block, the architecture patch
      # installed BEFORE core Init, a generic Width/Height the reference does
      # not set, and a version stamp that no driver accepts. Every one of those
      # is invisible in a build that succeeds, and the run they produce still
      # looks like a result.
      #
      # So the corrected reference contract is asserted HERE, on the source, and
      # the build fails if any of it is missing or if any superseded construct
      # reappears.
      # ---------------------------------------------------------------------
      - name: Verify the corrected reference contract is in the source
        shell: bash
        run: |
          D=tools/processcontext_ab
          M="$D/main.cpp"
          FAIL=0
          note() { echo "::error::$1"; FAIL=1; }

          # ---- REQUIRED: the ApplicationId, at both entry points ----------
          grep -qF '0x1000000ULL' "$D/nv.h" || note "the NeuralScreen ApplicationId 0x1000000ULL is not in nv.h"
          grep -qF 'NS_APPLICATION_ID = 0x1000000ULL' "$D/nv.h" || note "the app id is not a named constant"
          grep -qF 'p_init(pcab::NS_APPLICATION_ID,' "$M" || \
            note "the core Init is not passed the NeuralScreen ApplicationId"
          grep -qF 'p_sinit(pcab::NS_APPLICATION_ID,' "$M" || \
            note "the snippet Init_Ext is not passed the NeuralScreen ApplicationId"

          # ---- REQUIRED: the private parameter block ----------------------
          grep -qF 'NVSDK_NGX_D3D12_AllocateParameters' "$M" || note "AllocateParameters is not resolved"
          grep -qF 'p_alloc(&params)' "$M" || note "AllocateParameters is not called"
          grep -qF 'params->Reset();' "$M" || note "params->Reset() is not called"

          # ---- REQUIRED: the exact 640x360 creation contract -------------
          for S in CreationNodeMask VisibilityNodeMask \
                   'DLSSNR.Width' 'DLSSNR.Height' \
                   'DLSSNR.InputWidth' 'DLSSNR.InputHeight' \
                   'DLSSNR.OutputWidth' 'DLSSNR.OutputHeight' \
                   'DLSSNR.Output.Width' 'DLSSNR.Output.Height' \
                   'DLSSNR.Upscaling' 'DLSSNR.Scale' 'DLSSNR.ScalingRatio' \
                   'DLSSNR.Hint.Render.Preset' \
                   'NVSDK_NGX_Parameter_DLSS_Feature_Create_Flags'; do
            grep -qF -- "$S" "$M" || note "the creation contract is missing $S"
          done
          # The generic pair is NOT part of NeuralScreen's contract, so setting
          # it would make this lane differ from the thing it reproduces.
          H=$(grep -nF -- 'NVSDK_NGX_Parameter_Width' "$M" || true)
          [ -z "$H" ] || { echo "$H"; note "a generic NVSDK_NGX_Parameter_Width is set; NeuralScreen does not set it"; }

          # ---- REQUIRED: the FeatureCommonInfo shape ---------------------
          grep -qF 'LoggingCallback = &ngx_log_discard;' "$M" || note "no discard logging callback"
          grep -qF 'MinimumLoggingLevel = NVSDK_NGX_LOGGING_LEVEL_OFF;' "$M" || note "MinimumLoggingLevel is not OFF"
          grep -qF 'DisableOtherLoggingSinks = true;' "$M" || note "DisableOtherLoggingSinks is not true"

          # ---- REQUIRED: the V2 version expression, not the old literal ---
          grep -qF 'sizeof(NV_GPU_ARCH_INFO) | (2u << 16)' "$D/nv.h" || \
            note "the NV_GPU_ARCH_INFO V2 stamp is not sizeof(struct) | (2u << 16)"
          grep -qF 'sizeof(NV_GPU_ARCH_INFO) | (1u << 16)' "$D/nv.h" || \
            note "the NeuralScreen V1 fallback stamp is missing"
          H=$(grep -rnF '2000u' "$D" || true)
          [ -z "$H" ] || { echo "$H"; note "the superseded version literal is back"; }

          # ---- REQUIRED: the order, asserted by line position -------------
          #
          # NeuralScreen v1.15.0's sequence. Note where NvAPI_Initialize sits:
          # AFTER core Init and AFTER AllocateParameters, and the observer after
          # the architecture work and before the private runtime loads.
          line_of() { grep -nF -- "$2" "$1" | head -n1 | cut -d: -f1; }
          L_DEV=$(line_of "$M"     'D3D12CreateDevice(ad_4070')
          L_CORE=$(line_of "$M"    'pcab::ngx_load_core()')
          L_INIT=$(line_of "$M"    'lane.core_init = (unsigned)p_init(pcab::NS_APPLICATION_ID,')
          L_ALLOC=$(line_of "$M"   'lane.alloc = (unsigned)p_alloc(&params)')
          L_NVAPI=$(line_of "$M"   'pcab::nv_load_and_initialize()')
          L_TARGET=$(line_of "$M"  'pcab::nv_set_arch_target(VENDOR_NVIDIA, PCI_RTX_4070);')
          L_CACHE=$(line_of "$M"   'pcab::arch_cache_real()')
          L_PATCH=$(line_of "$M"   'pcab::arch_patch_install()')
          L_OBSERVE=$(line_of "$M" 'pcab::observe_install(mode)')
          L_SNIP=$(line_of "$M"    'pcab::ngx_load_snippet(nr_dll)')
          L_SINIT=$(line_of "$M"   'lane.snip_init = (unsigned)p_sinit(pcab::NS_APPLICATION_ID,')
          L_RESET=$(line_of "$M"   'apply_reference_contract(lane.params)')
          L_CREATE=$(line_of "$M"  'p_create(lane.list, NVSDK_NGX_Feature_Reserved18')
          for V in L_DEV L_CORE L_INIT L_ALLOC L_NVAPI L_TARGET L_CACHE L_PATCH L_OBSERVE \
                   L_SNIP L_SINIT L_RESET L_CREATE; do
            eval "v=\$$V"
            [ -n "$v" ] || note "the required step $V was not found in main.cpp"
          done
          order_ok() { [ -n "$1" ] && [ -n "$2" ] && [ "$1" -lt "$2" ]; }
          order_ok "$L_DEV" "$L_CORE"        || note "the RTX 4070 device is not created first"
          order_ok "$L_CORE" "$L_INIT"       || note "the NGX core is not loaded before core Init"
          order_ok "$L_INIT" "$L_ALLOC"      || note "core Init is not before AllocateParameters"
          order_ok "$L_ALLOC" "$L_NVAPI"     || note "NvAPI_Initialize is not AFTER AllocateParameters"
          order_ok "$L_NVAPI" "$L_TARGET"    || note "the spoof target is named before NvAPI_Initialize"
          order_ok "$L_TARGET" "$L_CACHE"    || note "the real architectures are not cached after the target is named"
          order_ok "$L_CACHE" "$L_PATCH"     || note "the real architectures are not cached before the hook"
          order_ok "$L_PATCH" "$L_OBSERVE"   || note "the observer is not installed after the architecture patch"
          order_ok "$L_OBSERVE" "$L_SNIP"    || note "the observer is not installed before the private runtime loads"
          order_ok "$L_SNIP" "$L_SINIT"      || note "the snippet is not loaded before snippet Init_Ext"
          order_ok "$L_SINIT" "$L_RESET"     || note "Reset is not after snippet Init_Ext"
          order_ok "$L_RESET" "$L_CREATE"    || note "CreateFeature is not after the creation contract"
          # The three the stale revisions got wrong, each asserted on its own so
          # a failure names exactly which rule broke.
          order_ok "$L_INIT" "$L_NVAPI"      || note "NvAPI_Initialize IS CALLED BEFORE CORE INIT"
          order_ok "$L_INIT" "$L_PATCH"      || note "THE ARCHITECTURE PATCH IS INSTALLED BEFORE CORE INIT"
          order_ok "$L_INIT" "$L_OBSERVE"    || note "THE OBSERVER IS INSTALLED BEFORE CORE INIT"
          echo "order: device=$L_DEV core=$L_CORE init=$L_INIT alloc=$L_ALLOC nvapi=$L_NVAPI target=$L_TARGET cache=$L_CACHE patch=$L_PATCH observe=$L_OBSERVE snippet=$L_SNIP sinit=$L_SINIT reset=$L_RESET create=$L_CREATE"

          # ---- REQUIRED: the data path is dirname(--nr-dll) ---------------
          grep -qF 'const bool explicit_override = (data_path != nullptr);' "$M" || \
            note "--data-path is not treated as an explicit override"
          grep -qF 'if (!explicit_override) data_path = derived_data;' "$M" || \
            note "the data path is not derived from --nr-dll"
          grep -qF 'wcsncpy(derived_data, nr_dll' "$M" || \
            note "the derived data path does not start from the NR DLL path"
          grep -qF 'NR DLL path' "$M" || note "the NR DLL path is not logged"
          grep -qF 'derived data path' "$M" || note "the derived data path is not logged"
          grep -qF 'the DLL is NOT inside the directory it would be given' "$M" || \
            note "there is no containment check that the DLL is inside the data path"
          grep -qF 'reason=NR_DLL_NOT_IN_DATA_PATH' "$M" || \
            note "a DLL outside the data path does not invalidate the run"
          # The executable's own directory must no longer be the default.
          H=$(grep -nF 'default_data' "$M" || true)
          [ -z "$H" ] || { echo "$H"; note "the data path still defaults to the executable directory"; }
          # The derivation must precede the hash gate and the load.
          L_DERIVE=$(line_of "$M" 'if (!explicit_override) data_path = derived_data;')
          L_HASH=$(line_of "$M"   'if (!pcab::sha256_file(nr_dll, hex, &size))')
          order_ok "$L_DERIVE" "$L_HASH" || note "the data path is not derived before the hash gate"
          echo "data path: derive=$L_DERIVE hashgate=$L_HASH"

          # ---- REJECTED: the superseded constructs ------------------------
          for S in 'p_init(0ULL' 'p_sinit(0ULL' 'GetCapabilityParameters'; do
            H=$(grep -rnF -- "$S" "$D" || true)
            [ -z "$H" ] || { echo "$H"; note "the superseded construct '$S' is present"; }
          done

          # ---- REQUIRED: the eight SINGLE validity conditions -------------
          for S in 'lane.core_init == 0x00000001u' 'lane.alloc == 0x00000001u' \
                   'lane.snip_init == 0x00000001u' 'obs.real_descriptor_status == 0' \
                   'obs.real_cumodule_status == 0' 'obs.first_blob_size == 3944768ULL' \
                   'lane.feature == 0x00000001u' 'lane.handle != nullptr'; do
            grep -qF -- "$S" "$M" || note "the SINGLE validity gate is missing $S"
          done

          # ---- REQUIRED: the dual-arm boundaries -------------------------
          grep -qF 'valid=NO reason=SECOND_DEVICE_STILL_REFERENCED' "$M" || \
            note "dual-released does not fail when the device is still referenced"
          H=$(grep -nF 'CreateCommittedResource' "$M" || true)
          [ -z "$H" ] || { echo "$H"; note "dual-active creates a committed resource; it must hold device+queue+heap only"; }
          H=$(grep -nF 'CreateConstantBufferView' "$M" || true)
          [ -z "$H" ] || { echo "$H"; note "dual-active writes a CBV; it must hold device+queue+heap only"; }

          # ---- REJECTED: any holder surface at all -----------------------
          # The holder is a SEPARATE PROGRAM now (tools/processcontext_holder/),
          # because a holder MODE inside this file would have changed the
          # executable that runs the RTX 4070 reference lane - and an isolation
          # experiment whose reference binary changed is not an isolation
          # experiment. This source is frozen at the implementation that produced
          # the PROCESSCONTEXT evidence; the manifest gate above is the real
          # proof, and this is the second, readable statement of the same rule.
          for S in 'holder-ti' 'holder_ti' 'HOLDER_READY' 'HOLDER_FAILED' 'HOLDER_STOPPED' \
                   '--holder-event' '--holder-seconds' 'is_holder' 'run_holder_ti'; do
            H=$(grep -nF -- "$S" "$M" || true)
            [ -z "$H" ] || { echo "$H"; note "'$S' is back in the diagnostic: it has grown a holder surface"; }
          done

          [ "$FAIL" -eq 0 ] || exit 1
          echo "reference contract verified: app id, private block, order, V2 stamp, per-GPU spoof target and the eight SINGLE conditions are all present, every superseded construct is absent, and the file carries no holder surface."

      # ---------------------------------------------------------------------
      # 7. Dependencies, pinned. Same SHAs as every other workflow in this repo.
      # ---------------------------------------------------------------------
      - name: Fetch NVIDIA NGX headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/ngx.tar.gz \
            "https://codeload.github.com/NVIDIA/DLSS/tar.gz/${NGX_SHA}"
          tar -xzf _dl/ngx.tar.gz -C _dl --wildcards "*/include"
          rm -rf ext/ngx
          mv _dl/*/include ext/ngx
          test -f ext/ngx/nvsdk_ngx.h
          grep -rq 'NVSDK_NGX_Feature_Reserved18' ext/ngx || {
            echo "::error::Pin drift - no NVSDK_NGX_Feature_Reserved18"; exit 1; }

      - name: Fetch and build MinHook at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/minhook.tar.gz \
            "https://codeload.github.com/TsudaKageyu/minhook/tar.gz/${MINHOOK_SHA}"
          tar -xzf _dl/minhook.tar.gz -C _dl
          rm -rf ext/minhook
          mv _dl/minhook-* ext/minhook
          test -f ext/minhook/include/MinHook.h
          cmake -S ext/minhook -B ext/minhook/build -A x64 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build ext/minhook/build --config Release
          LIB=$(find ext/minhook/build -type f \( -iname 'minhook.x64.lib' -o -iname '*minhook*.lib' \) | head -n1)
          if [ -z "$LIB" ]; then
            echo "::error::no MinHook static library found"
            find ext/minhook/build -type f | sort | head -50 || true
            exit 1
          fi
          echo "discovered MinHook library: $LIB"
          mkdir -p ext/minhook/lib
          cp "$LIB" ext/minhook/lib/MinHook.lib
          test -f ext/minhook/lib/MinHook.lib

      # ---------------------------------------------------------------------
      # 8. Configure and build. This is the exact build command, recorded.
      # ---------------------------------------------------------------------
      - name: Configure (processcontext-ab)
        shell: bash
        run: |
          cmake -S tools/processcontext_ab -B build-pcab -A x64 \
            -DPCAB_NGX_DIR="${{ github.workspace }}/ext/ngx" \
            -DPCAB_MINHOOK_DIR="${{ github.workspace }}/ext/minhook" 2>&1 | tee _cfg.txt
          grep -q "PROCESSCONTEXT-AB: NGX headers from" _cfg.txt || {
            echo "::error::configured without the NGX headers"; exit 1; }
          grep -q "PROCESSCONTEXT-AB: MinHook from" _cfg.txt || {
            echo "::error::configured without MinHook"; exit 1; }
          grep -q "PROCESSCONTEXT-AB: output" _cfg.txt || {
            echo "::error::the output path was not announced"; exit 1; }
          echo "--- configure summary ---"
          grep -n "PROCESSCONTEXT-AB" _cfg.txt

      - name: Build (processcontext-ab)
        run: cmake --build build-pcab --config Release

      # ---------------------------------------------------------------------
      # 8b. The holder. Its own project, its own binary, no dependencies to
      #     point at: the configure line is deliberately shorter than the
      #     diagnostic's, and that difference is the containment.
      # ---------------------------------------------------------------------
      - name: Configure (processcontext-holder)
        shell: bash
        run: |
          cmake -S tools/processcontext_holder -B build-holder -A x64 2>&1 | tee _cfg_holder.txt
          grep -q "PROCESSCONTEXT-HOLDER: independent" _cfg_holder.txt || {
            echo "::error::the holder's configure did not state its independence"; exit 1; }
          grep -q "PROCESSCONTEXT-HOLDER: output" _cfg_holder.txt || {
            echo "::error::the holder's output path was not announced"; exit 1; }
          echo "--- configure summary ---"
          grep -n "PROCESSCONTEXT-HOLDER" _cfg_holder.txt

      - name: Build (processcontext-holder)
        run: cmake --build build-holder --config Release

      - name: Verify the holder binary and its imports
        shell: bash
        run: |
          HEXE=$(find build-holder -name 'holder_ti.exe' -type f | head -n1)
          if [ -z "$HEXE" ]; then
            echo "::error::holder_ti.exe was not produced"
            find build-holder -maxdepth 3 -type f || true
            exit 1
          fi
          echo "HEXE_PATH=$HEXE" >> "$GITHUB_ENV"
          echo "output: $HEXE"

          # The holder's own protocol must be IN the binary, or the parent would
          # wait forever for a line this build cannot print.
          for S in HOLDER_READY HOLDER_FAILED HOLDER_STOPPED \
                   'CreateDXGIFactory1' 'D3D12CreateDevice' 'CreateCommandQueue' \
                   'CreateDescriptorHeap' 'CBV_SRV_UAV' 'context-holder.log'; do
            if ! grep -qa -- "$S" "$HEXE"; then
              echo "::error::'$S' is not present in $HEXE - the holder was compiled out"
              exit 1
            fi
          done

          # AND NO NEURAL RUNTIME. The four identifiers the holder must not
          # contain, in the BINARY that ships.
          for S in NVSDK_NGX nvngx_dlssnr NvAPI_Initialize Reserved18; do
            if grep -qa -- "$S" "$HEXE"; then
              echo "::error::'$S' is present in $HEXE - this is not a holder, it is a lane"
              exit 1
            fi
          done

          # ---- the import table ------------------------------------------
          # A string scan cannot see a library the holder links but never names.
          # The imports are read directly: d3d12 and dxgi, plus the CRT and
          # kernel32/dxgi machinery every console program has. Anything that
          # could reach a neural runtime fails the build.
          python - "$HEXE" <<'PY'
          import struct, sys

          path = sys.argv[1]
          data = open(path, "rb").read()

          # PE: e_lfanew at 0x3C, then the optional header's data directories.
          # In a PE32+ optional header the data directories start at offset 112,
          # so directory 0 (exports) is at 112 and directory 1 (IMPORTS) is at
          # 120. Reading 112 gives the export directory, which an executable
          # normally does not have - so the mistake shows up as "not mapped"
          # rather than as an empty list.
          e_lfanew = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[e_lfanew:e_lfanew + 4] == b"PE\0\0", "not a PE image"
          coff = e_lfanew + 4
          n_sections = struct.unpack_from("<H", data, coff + 2)[0]
          opt_size = struct.unpack_from("<H", data, coff + 16)[0]
          opt = coff + 20
          magic = struct.unpack_from("<H", data, opt)[0]
          assert magic == 0x20B, "not a PE32+ image"
          n_dirs = struct.unpack_from("<I", data, opt + 108)[0]
          assert n_dirs >= 2, "the image has no import data directory"
          imp_rva, imp_size = struct.unpack_from("<II", data, opt + 120)
          assert imp_rva and imp_size, "the import data directory is empty"
          sections = []
          sec = opt + opt_size
          for i in range(n_sections):
            off = sec + i * 40
            va, vsize = struct.unpack_from("<II", data, off + 12)
            raw_size, raw = struct.unpack_from("<II", data, off + 16)
            sections.append((va, max(vsize, raw_size), raw))

          def rva_to_off(rva):
            for va, size, raw in sections:
              if va <= rva < va + size:
                  return raw + (rva - va)
            return None

          off = rva_to_off(imp_rva)
          assert off is not None, "the import directory is not mapped"
          names = []
          while True:
            entry = data[off:off + 20]
            if len(entry) < 20 or entry == b"\0" * 20:
                break
            name_rva = struct.unpack_from("<I", entry, 12)[0]
            if name_rva == 0:
                break
            no = rva_to_off(name_rva)
            end = data.index(b"\0", no)
            names.append(data[no:end].decode("ascii", "replace"))
            off += 20

          print("imports: " + ", ".join(sorted(names)))

          # POSITIVE CONTROL. A reader that silently found nothing would let any
          # binary through, so an empty import list is a failure of the gate
          # itself and not a pass.
          if len(names) < 3:
            print("::error::only %d import(s) were read - the import table walk "
                  "is not working" % len(names))
            sys.exit(1)

          FORBIDDEN = ("nvapi", "ngx", "dlss", "cuda", "nvcuda", "nvml", "minhook")
          bad = [n for n in names
                 if any(f in n.lower() for f in FORBIDDEN)]
          if bad:
            print("::error::the holder imports %s" % ", ".join(bad))
            sys.exit(1)
          required = {"d3d12.dll", "dxgi.dll"}
          missing = sorted(required - set(n.lower() for n in names))
          if missing:
            print("::error::the holder does not import %s" % ", ".join(missing))
            sys.exit(1)
          print("imports verified: d3d12 and dxgi, and nothing that reaches a neural runtime.")
          PY
          echo "holder verified: protocol present, forbidden identifiers absent, imports clean."

      - name: Verify the artifact
        shell: bash
        run: |
          EXE=$(find build-pcab -name 'processcontext_ab.exe' -type f | head -n1)
          if [ -z "$EXE" ]; then
            echo "::error::processcontext_ab.exe was not produced"
            find build-pcab -maxdepth 3 -type f || true
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> "$GITHUB_ENV"
          echo "output: $EXE"

          # The instrumentation must be IN the binary that ships, not merely in
          # the source tree. Every one of these is a string literal this build
          # emits, so a compile-out shows up here.
          for S in PROCESSCONTEXT-AB PCAB-RESULT GetCudaIndependentDescriptorObject \
                   CreateCuModule NVSDK_NGX_Feature_Reserved18 nvngx.dll \
                   'context-%s.log' 'dual-released' \
                   NVSDK_NGX_D3D12_AllocateParameters CreationNodeMask VisibilityNodeMask \
                   'DLSSNR.InputWidth' 'DLSSNR.OutputWidth' 'DLSSNR.ScalingRatio' \
                   'DLSSNR.Hint.Render.Preset' 'SECOND_DEVICE_STILL_REFERENCED'; do
            if ! grep -qa -- "$S" "$EXE"; then
              echo "::error::'$S' is not present in $EXE - the diagnostic was compiled out"
              exit 1
            fi
          done
          # And the forbidden strings must NOT be in it: this binary carries no
          # game path, no add-on module name and no deployment path. The game's
          # SUBJECT is named in the output on purpose; its executable is not.
          for S in 'Cyberpunk2077' '.addon64' 'ReShade' 'Streamline' 'PC_GAMES' 'bin\x64'; do
            if grep -qa -- "$S" "$EXE"; then
              echo "::error::'$S' is present in $EXE - this binary is not a standalone diagnostic"
              exit 1
            fi
          done

          # NOR ANY HOLDER SURFACE. The holder is a different program with a
          # different job, and the isolation experiment is only readable if the
          # binary running the RTX 4070 lane is the one that ran the reference
          # arm. A holder mode or a holder token reappearing here means the
          # diagnostic was modified again, and the run would be void.
          for S in 'holder-ti' 'HOLDER_READY' 'HOLDER_FAILED' 'HOLDER_STOPPED' \
                   '--holder-event' '--holder-seconds' 'holder_ti'; do
            if grep -qa -- "$S" "$EXE"; then
              echo "::error::'$S' is present in $EXE - the diagnostic has grown a holder surface"
              exit 1
            fi
          done
          echo "instrumentation strings present; no game path, add-on name or deployment path,"
          echo "and no holder surface: processcontext_ab.exe is the frozen reference binary."

      # ---------------------------------------------------------------------
      # 9. The three GPU-free behavioural tests. The runner has no NVIDIA
      #    adapter, so these are the paths that can be exercised here - and the
      #    third is the one that matters: a wrong snippet build must be REFUSED
      #    before anything is loaded or created.
      # ---------------------------------------------------------------------
      - name: Behavioural tests (no GPU required)
        shell: bash
        run: |
          set +e
          mkdir -p _bt && cd _bt

          # (a) the table path, with no arm logs present: it must print the fixed
          #     table and refuse to interpret anything.
          ../"$EXE_PATH" --mode table > table.txt 2>&1
          RC=$?
          cat table.txt
          grep -q 'PROCESSCONTEXT-AB  -  FIXED RESULT TABLE' table.txt || { echo "::error::the fixed table header is missing"; exit 1; }
          grep -q 'MODE            VALID  LANE' table.txt || { echo "::error::the fixed column header is missing"; exit 1; }
          grep -q 'NO VERDICT: mode "single" is absent' table.txt || { echo "::error::an absent reference arm was not refused"; exit 1; }
          [ "$RC" -eq 4 ] || { echo "::error::table with no logs exited $RC, expected 4"; exit 1; }
          echo "(a) table path ok, exit $RC"

          # (b) a mode without --nr-dll is a usage error, not a silent run.
          ../"$EXE_PATH" --mode single > usage.txt 2>&1
          RC=$?
          [ "$RC" -eq 1 ] || { echo "::error::--mode single without --nr-dll exited $RC, expected 1"; exit 1; }
          grep -q -- '--nr-dll is required' usage.txt || { echo "::error::the usage error does not name --nr-dll"; exit 1; }
          echo "(b) usage path ok, exit $RC"

          # (c) THE HASH GATE. A file that is not the required snippet build must
          #     be REFUSED, and refused BEFORE anything is loaded or created.
          printf 'not the neural runtime' > wrong.dll
          ../"$EXE_PATH" --mode single --nr-dll wrong.dll > gate.txt 2>&1
          RC=$?
          cat gate.txt
          [ "$RC" -eq 1 ] || { echo "::error::a wrong NR DLL exited $RC, expected 1"; exit 1; }
          grep -q 'MISMATCH' gate.txt || { echo "::error::a wrong NR DLL was not reported as a mismatch"; exit 1; }
          grep -q 'ABORTING before the load' gate.txt || { echo "::error::the gate did not abort before the load"; exit 1; }
          grep -q 'valid=NO reason=NR_DLL_SHA256_MISMATCH' gate.txt || { echo "::error::the gate did not record an invalid arm"; exit 1; }
          # Nothing may have been created or resolved on this path.
          for S in 'D3D12CreateDevice' 'NvAPI_Initialize' 'nvapi_QueryInterface detoured' 'CreateFeature'; do
            if grep -q -- "$S" gate.txt; then
              echo "::error::the hash gate let '$S' happen before refusing the DLL"
              exit 1
            fi
          done
          echo "(c) hash gate ok, exit $RC - refused before any load, device or call"

          # (d) an unknown argument is refused rather than ignored.
          ../"$EXE_PATH" --mode single --frobnicate > arg.txt 2>&1
          RC=$?
          [ "$RC" -eq 1 ] || { echo "::error::an unknown argument exited $RC, expected 1"; exit 1; }
          echo "(d) argument path ok, exit $RC"

          # (e) THE DATA PATH DERIVATION. The reference experiment must be handed
          #     dirname(--nr-dll), which is NeuralScreen's data path, and NOT the
          #     diagnostic's own directory. Exercised for real, with no GPU: the
          #     derivation runs before the hash gate.
          mkdir -p refdir
          printf 'not the neural runtime' > refdir/nvngx_dlssnr.dll
          ../"$EXE_PATH" --mode single --nr-dll refdir/nvngx_dlssnr.dll > derive.txt 2>&1
          RC=$?
          cat derive.txt
          grep -q '\[path\]  NR DLL path' derive.txt || { echo "::error::the NR DLL path is not logged"; exit 1; }
          grep -q '\[path\]  derived data path' derive.txt || { echo "::error::the derived data path is not logged"; exit 1; }
          grep -q 'derived data path  = refdir' derive.txt || {
            echo "::error::the data path was not derived from --nr-dll (expected refdir)"
            grep -n 'derived data path' derive.txt || true; exit 1; }
          grep -q 'the NR DLL is inside the data path it will be given - OK' derive.txt || {
            echo "::error::the containment check did not pass for a DLL inside its own directory"; exit 1; }
          [ "$RC" -eq 1 ] || { echo "::error::expected the run to stop later at the hash gate (exit 1), got $RC"; exit 1; }
          grep -q 'NR_DLL_SHA256_MISMATCH' derive.txt || {
            echo "::error::the run did not reach the hash gate after the derivation"; exit 1; }
          echo "(e) data path derived from --nr-dll, containment check passed, then the hash gate"

          # (f) AN EXPLICIT --data-path THAT DOES NOT CONTAIN THE DLL must be
          #     REFUSED, before anything is hashed, loaded or created.
          mkdir -p otherdir
          ../"$EXE_PATH" --mode single --nr-dll refdir/nvngx_dlssnr.dll --data-path otherdir > notin.txt 2>&1
          RC=$?
          cat notin.txt
          [ "$RC" -eq 1 ] || { echo "::error::a DLL outside the data path exited $RC, expected 1"; exit 1; }
          grep -q 'is NOT inside the directory it would be given' notin.txt || {
            echo "::error::the containment check did not fire"; exit 1; }
          grep -q 'valid=NO reason=NR_DLL_NOT_IN_DATA_PATH' notin.txt || {
            echo "::error::the run was not invalidated for a DLL outside the data path"; exit 1; }
          grep -q 'NR DLL SHA256' notin.txt && {
            echo "::error::the run hashed the DLL before checking that it is inside the data path"; exit 1; }
          for S in 'D3D12CreateDevice' 'NvAPI_Initialize' 'CreateFeature'; do
            if grep -q -- "$S" notin.txt; then
              echo "::error::'$S' happened before the data-path containment check refused the run"
              exit 1
            fi
          done
          echo "(f) a DLL outside the data path is refused before any hash, device or call"

          # (g) the explicit override is still honoured when it IS the DLL's own
          #     directory, so --data-path remains usable.
          ../"$EXE_PATH" --mode single --nr-dll refdir/nvngx_dlssnr.dll --data-path refdir > override.txt 2>&1
          RC=$?
          grep -q 'from an explicit --data-path override' override.txt || {
            echo "::error::an explicit --data-path that matches is not honoured"
            cat override.txt; exit 1; }
          grep -q 'NR_DLL_SHA256_MISMATCH' override.txt || {
            echo "::error::the override run did not reach the hash gate"; exit 1; }
          echo "(g) a matching --data-path override is accepted, then the hash gate"

      # ---------------------------------------------------------------------
      # 10. The artifact: the two executables, the launcher, the README and the
      #     manifest. holder_ti.exe ships here because the split-process node
      #     needs BOTH processes to come from one verified build.
      # ---------------------------------------------------------------------
      - name: Stage and hash the artifact
        shell: bash
        run: |
          mkdir -p _pcab
          cp "$EXE_PATH"                       _pcab/processcontext_ab.exe
          cp "$HEXE_PATH"                      _pcab/holder_ti.exe
          cp tools/processcontext_ab/RUN-CONTEXT-AB.cmd _pcab/
          cp tools/processcontext_ab/README.txt         _pcab/

          ( cd _pcab && sha256sum processcontext_ab.exe holder_ti.exe RUN-CONTEXT-AB.cmd README.txt ) > _pcab/SHA256SUMS.txt
          cat _pcab/SHA256SUMS.txt

          # THE TWO BINARIES MUST NOT BE THE SAME FILE, and each must be the one
          # it claims to be: the diagnostic carries the lane's instrumentation,
          # the holder carries none of it.
          grep -qa 'PCAB-RESULT' _pcab/processcontext_ab.exe || {
            echo "::error::processcontext_ab.exe has no PCAB-RESULT"; exit 1; }
          grep -qa 'PCAB-RESULT' _pcab/holder_ti.exe && {
            echo "::error::holder_ti.exe contains the diagnostic's result line"; exit 1; }
          if cmp -s _pcab/processcontext_ab.exe _pcab/holder_ti.exe; then
            echo "::error::the two executables are identical"; exit 1
          fi

          COUNT=$(find _pcab -type f | wc -l)
          [ "$COUNT" -eq 5 ] || { echo "::error::the artifact holds $COUNT files, expected 5"; find _pcab -type f | sort; exit 1; }
          test -f _pcab/processcontext_ab.exe
          test -f _pcab/holder_ti.exe
          test -f _pcab/RUN-CONTEXT-AB.cmd
          test -f _pcab/README.txt
          test -f _pcab/SHA256SUMS.txt

          {
            echo "variant   = processcontext-ab"
            echo
            echo "PROCESSCONTEXT-AB: four arms, one process each, one fixed table."
            echo "It answers whether process-global / multi-device D3D12 state explains"
            echo "why the private NVAPI CUDA-interop calls 0x0DDAC234 and 0xAD1A677D"
            echo "fail inside Cyberpunk but succeed in NeuralScreen."
            echo
            echo "holder_ti.exe: PROCESS A of SPLITPROCESS_ISOLATION. It holds active"
            echo "RTX 4070 Ti SUPER D3D12 state - device, DIRECT queue, CBV/SRV/UAV"
            echo "heap - in its own process while processcontext_ab.exe runs the SINGLE"
            echo "arm in another. No NGX, no NVAPI, no CUDA, no NR runtime, no"
            echo "swapchain, no submission. It shares no source with the diagnostic:"
            echo "the executable running the lane has to be the proven one."
            echo
            echo "commit    = ${GITHUB_SHA}"
            echo "run       = ${GITHUB_RUN_ID}"
            echo "built     = $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "build commands:"
            echo "  cmake -S tools/processcontext_ab -B build-pcab -A x64 \\"
            echo "        -DPCAB_NGX_DIR=<ext/ngx> -DPCAB_MINHOOK_DIR=<ext/minhook>"
            echo "  cmake --build build-pcab --config Release"
            echo "  cmake -S tools/processcontext_holder -B build-holder -A x64"
            echo "  cmake --build build-holder --config Release"
            echo
            echo "pins:"
            echo "  NVIDIA/DLSS       ${NGX_SHA}"
            echo "  TsudaKageyu/minhook ${MINHOOK_SHA}"
            echo
            echo "This does NOT modify MGPU, NeuralScreen, Cyberpunk or any NVIDIA"
            echo "binary, and it never launches the game. It does not deploy."
          } > PCAB_VARIANT.txt
          cat PCAB_VARIANT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: processcontext-ab
          path: |
            _pcab/
            PCAB_VARIANT.txt
          if-no-files-found: error
